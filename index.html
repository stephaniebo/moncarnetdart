}

async function callArtAI(title, artist, movementHint, periodHint){
  const movementList = movementKeys().join(', ');
  const prompt = `Tu es un historien de l'art rigoureux. La personne a indiqué le titre "${title}" et l'artiste "${artist}"${movementHint?` (courant indiqué : ${movementHint})`:''}${periodHint?`, période indiquée : ${periodHint}`:''} — ces informations peuvent être abrégées, mal orthographiées ou incomplètes. Identifie l'œuvre la plus probable et réponds UNIQUEMENT avec un objet JSON valide, sans backticks ni texte avant/après, au format exact suivant :
{
  "correctedTitle": "titre complet et exact de l'œuvre (corrige les fautes, complète si abrégé ; identique à l'original si déjà exact)",
  "correctedArtist": "nom complet et exact de l'artiste (corrige les fautes, complète le prénom si absent ; identique à l'original si déjà exact)",
  "description": "2-3 phrases présentant l'œuvre : sujet, contexte de création, pourquoi elle est connue",
  "commissionNote": "une phrase indiquant qui a commandé l'œuvre ou pour quelle occasion/événement elle a été créée, UNIQUEMENT si c'est documenté (commande officielle, événement précis) ; chaîne vide si c'était une simple démarche créative personnelle sans commanditaire ni occasion particulière",
  "composition": ["premier paragraphe d'analyse (composition/symbolique)", "deuxième paragraphe (contexte historique)", "troisième paragraphe optionnel"],
  "anecdote": "un fait insolite, peu connu ou surprenant sur cette œuvre précise (1-3 phrases) ; chaîne vide si rien de notable à signaler",
  "artistBio": "biographie complète et développée de l'artiste (8-12 phrases : formation, évolution du style, place dans l'histoire de l'art) — pas seulement 2-3 phrases",
  "artistMajorWorks": ["Titre 1 (année)", "Titre 2 (année)", "Titre 3 (année)", "Titre 4 (année, optionnel)", "Titre 5 (année, optionnel)"],
  "artistAlert": "une ou deux phrases factuelles et neutres UNIQUEMENT si l'artiste a fait l'objet d'accusations largement documentées de violence, d'actes illégaux ou assimilés (ex. violences conjugales documentées, actes de guerre, etc.) ; chaîne vide dans tous les autres cas — ne jamais inventer, ne jamais exagérer, rester factuel",
  "artistNationality": "nationalité de l'artiste",
  "artistBirth": "année de naissance, nombre seul, chaîne vide si inconnue ou non pertinente",
  "artistDeath": "année de décès, nombre seul, chaîne vide si vivant(e) ou inconnue",
  "similarArtists": "2-3 noms d'artistes proches séparés par des virgules",
  "tags": ["3", "4", "mots-cles", "courts"],
  "technique": "technique et dimensions si connues, chaîne vide sinon",
  "originalTitle": "titre en langue d'origine si différent, chaîne vide sinon",
  "museum": "nom du musée, de la galerie, du lieu ou de la collection où l'œuvre se trouve ou est exposée ; utilise \"Collection privée\" si non localisable publiquement",
  "museumCity": "ville où se trouve l'œuvre, chaîne vide si vraiment inconnue",
  "museumCountry": "pays où se trouve l'œuvre, chaîne vide si vraiment inconnue",
  "museumLink": "URL du site officiel du musée/de la collection si connue, chaîne vide sinon",
  "movements": ["TOUS les courants EXACTS pertinents parmi cette liste (tableau) : ${movementList}. Ne te limite pas à un seul par défaut : identifie chaque courant auquel l'œuvre peut raisonnablement être rattachée (ex. une œuvre post-impressionniste précurseur du fauvisme peut relever des deux à la fois). N'en propose qu'un seul uniquement si les autres ne s'appliquent vraiment pas. Place toujours le courant principal (le plus représentatif de l'œuvre) en premier dans le tableau."],
  "period": "date ou période de création, ex. 1830 ou 1818-1819"
}
Si le titre ou l'artiste fournis sont ambigus au point de ne pas pouvoir identifier une œuvre précise, garde "correctedTitle" et "correctedArtist" identiques à ce qui a été fourni plutôt que d'inventer.
Sois factuel. Si tu n'es pas certain d'une date ou d'une dimension précise, indique une valeur approximative plutôt que d'inventer un chiffre exact. Le champ "composition" doit être un tableau JSON de chaînes (une chaîne par paragraphe, sans retour à la ligne à l'intérieur d'une chaîne). Réponds en français.`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1600, messages: [{ role: "user", content: prompt }] })
  });
  if(!response.ok){
    const errText = await response.text().catch(()=>'(illisible)');
    throw new Error('Erreur API ' + response.status + ' : ' + errText.slice(0,300));
  }
  const responseClone = response.clone();
  let data;
  try{
    data = await response.json();
  }catch(jsonErr){
    const raw = await responseClone.text().catch(()=>'');
    throw new Error('Réponse serveur non-JSON : ' + (raw ? raw.slice(0,300) : '(réponse vide)'));
  }
  const textResp = (data.content || []).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  const clean = textResp.replace(/```json|```/g,'').trim().replace(/[\r\n]+/g,' ');
  let result;
  try{
    result = JSON.parse(clean);
  }catch(parseErr){
    throw new Error('Réponse IA imprévue : ' + (clean ? clean.slice(0,300) : '(vide)'));
  }
  result.composition = Array.isArray(result.composition) ? result.composition.join('\n\n') : (result.composition || '');
  if(result.commissionNote && result.commissionNote.trim()){
    result.description = (result.description || '').trim() + '\n' + result.commissionNote.trim();
  }
  result.artistMajorWorks = Array.isArray(result.artistMajorWorks) ? result.artistMajorWorks.join('\n') : (result.artistMajorWorks || '');
  return result;
}

  zone.addEventListener('click', ()=> document.getElementById('idPhotoFile').click());
  document.getElementById('idPhotoFile').addEventListener('change', async (e)=>{
    if(e.target.files[0]){
      formMainImageData = await fileToDataURL(e.target.files[0]);
      document.getElementById('idPhotoZoneText').innerHTML = '<img class="zone-preview" src="'+formMainImageData+'"><div>Photo prête — cliquez « Identifier »</div>';
    }
  });
  zone.addEventListener('paste', async (e)=>{
    const items = (e.clipboardData || window.clipboardData).items;
    for(const item of items){
      if(item.type.indexOf('image')===0){
        formMainImageData = await fileToDataURL(item.getAsFile());
        document.getElementById('idPhotoZoneText').innerHTML = '<img class="zone-preview" src="'+formMainImageData+'"><div>Photo collée — cliquez « Identifier »</div>';
      }
    }
  });
}

async function identifyFromPhoto(){
  const status = document.getElementById('qaPhotoStatus');
  const btn = document.getElementById('idPhotoBtn');
  if(!formMainImageData){ status.innerHTML = '<span style="color:var(--accent);">Ajoutez d\'abord une photo.</span>'; return; }
  const parts = dataURLParts(formMainImageData);
  if(!parts){ status.innerHTML = '<span style="color:var(--accent);">Image invalide, réessayez.</span>'; return; }
  btn.disabled = true;
  status.textContent = 'Identification en cours…';
  const hint = document.getElementById('idPhotoHint').value.trim();
  const movementList = movementKeys().join(', ');
  const prompt = `Tu es un historien de l'art. Regarde cette image, qui montre une œuvre d'art (photo prise en exposition, reproduction, ou capture d'écran). Essaie de l'identifier avec certitude.
${hint ? `L'utilisateur a trouvé ces indices en ligne (peuvent être partiels, approximatifs, ou eux-mêmes erronés — à vérifier plutôt qu'à recopier tels quels) : "${hint}"\n` : ''}Réponds UNIQUEMENT avec un objet JSON valide, sans backticks ni texte autour, au format exact suivant :
{
  "identified": true ou false,
  "title": "titre de l'œuvre si identifiée avec confiance, chaîne vide sinon",
  "artist": "nom de l'artiste si identifié avec confiance, chaîne vide sinon",
  "originalTitle": "titre en langue d'origine si différent, chaîne vide sinon",
  "museum": "nom du musée, de la galerie, du lieu ou de la collection où l'œuvre se trouve ou est exposée ; utilise \"Collection privée\" si non localisable publiquement",
  "museumCity": "ville où se trouve l'œuvre, chaîne vide si vraiment inconnue",
  "museumCountry": "pays où se trouve l'œuvre, chaîne vide si vraiment inconnue",
  "museumLink": "URL du site officiel du musée/de la collection si connue, chaîne vide sinon",
  "description": "2-3 phrases présentant l'œuvre",
  "commissionNote": "une phrase indiquant qui a commandé l'œuvre ou pour quelle occasion/événement elle a été créée, UNIQUEMENT si c'est documenté ; chaîne vide si c'était une simple démarche créative personnelle sans commanditaire ni occasion particulière",
  "composition": ["premier paragraphe d'analyse (composition/symbolique)", "deuxième paragraphe (contexte historique)", "troisième paragraphe optionnel"],
  "anecdote": "un fait insolite, peu connu ou surprenant sur cette œuvre précise (1-3 phrases) ; chaîne vide si rien de notable",
  "artistBio": "biographie complète et développée de l'artiste (8-12 phrases : formation, évolution du style, place dans l'histoire de l'art)",
  "artistMajorWorks": ["Titre 1 (année)", "Titre 2 (année)", "Titre 3 (année)", "Titre 4 (année, optionnel)", "Titre 5 (année, optionnel)"],
  "artistAlert": "une ou deux phrases factuelles et neutres UNIQUEMENT si l'artiste a fait l'objet d'accusations largement documentées de violence, d'actes illégaux ou assimilés ; chaîne vide sinon — ne jamais inventer",
  "artistNationality": "nationalité de l'artiste",
  "artistBirth": "année de naissance, nombre seul, chaîne vide sinon",
  "artistDeath": "année de décès, nombre seul, chaîne vide si vivant(e) ou inconnue",
  "similarArtists": "2-3 noms d'artistes proches séparés par des virgules",
  "tags": ["3", "4", "mots-cles", "courts"],
  "technique": "technique et dimensions si connues, chaîne vide sinon",
  "movements": ["TOUS les courants EXACTS pertinents parmi cette liste (tableau) : ${movementList}. Ne te limite pas à un seul par défaut : identifie chaque courant auquel l'œuvre peut raisonnablement être rattachée (ex. une œuvre post-impressionniste précurseur du fauvisme peut relever des deux à la fois). N'en propose qu'un seul uniquement si les autres ne s'appliquent vraiment pas. Place toujours le courant principal (le plus représentatif de l'œuvre) en premier dans le tableau."],
  "period": "date ou période de création"
}
IMPORTANT : ne mets "identified": true que si tu es raisonnablement confiant. Si tu ne reconnais pas l'œuvre, mets "identified": false et laisse "title" et "artist" vides — n'invente jamais un titre ou un artiste. Le champ "composition" doit être un tableau JSON de chaînes (une chaîne par paragraphe, sans retour à la ligne à l'intérieur d'une chaîne). Réponds en français.`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1800,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: parts.mediaType, data: parts.base64 } },
            { type: "text", text: prompt }
          ]
        }]
      })
    });
    if(!response.ok){
      const errText = await response.text();
      status.innerHTML = '<span style="color:var(--accent);">Erreur API (' + response.status + ') : ' + esc(errText.slice(0,300)) + '</span>';
      btn.disabled = false;
      return;
    }
    const responseClone = response.clone();
    let data;
    try{
      data = await response.json();
    }catch(jsonErr){
      const raw = await responseClone.text().catch(()=>'(corps illisible)');
      status.innerHTML = '<span style="color:var(--accent);">La réponse du serveur n\'est pas du JSON valide. Contenu brut reçu :<br><span style="font-family:monospace;font-size:10.5px;">' + esc(raw.slice(0,400)) + '</span></span>';
      btn.disabled = false;
      return;
    }
    const textResp = (data.content || []).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    const clean = textResp.replace(/```json|```/g,'').trim().replace(/[\r\n]+/g,' ');
    let result;
    try{
      result = JSON.parse(clean);
    }catch(parseErr){
      status.innerHTML = '<span style="color:var(--accent);">Réponse imprévue — voici ce qui a été reçu :<br><span style="font-family:monospace;font-size:10.5px;">' + esc(clean.slice(0,400)) + '</span></span>';
      btn.disabled = false;
      return;
    }
    const compositionText = Array.isArray(result.composition) ? result.composition.join('\n\n') : (result.composition || '');
    if(result.commissionNote && result.commissionNote.trim()){
      result.description = (result.description || '').trim() + '\n' + result.commissionNote.trim();
    }
    const majorWorksText = Array.isArray(result.artistMajorWorks) ? result.artistMajorWorks.join('\n') : (result.artistMajorWorks || '');

    if(!result.identified || !result.title || !result.artist){
      status.innerHTML = '<span style="color:var(--accent);">Œuvre inconnue — essayez une photo plus nette ou cadrée sur l\'œuvre seule, ou revenez en arrière pour saisir le titre et l\'artiste manuellement.</span>';
      btn.disabled = false;
      return;
    }

    const dup = findDuplicate(result.title, result.artist);
    if(dup){
      status.innerHTML = '<span style="color:var(--accent);">« ' + esc(result.title) + ' » de ' + esc(result.artist) + ' est déjà dans votre carnet (N°' + String(dup.id).padStart(3,'0') + ').</span>';
      const actions = document.createElement('div');
      actions.style.cssText = 'display:flex;gap:8px;margin-top:8px;';
      actions.innerHTML = '<button class="small-btn ghost" id="dupViewBtn2">Voir la fiche existante</button><button class="small-btn ghost" id="dupForceBtn2">Créer quand même</button>';
      status.appendChild(actions);
      document.getElementById('dupViewBtn2').onclick = ()=>{ closeForm(); showArtwork(dup.id); };
      document.getElementById('dupForceBtn2').onclick = ()=> finalizePhotoIdentify(result, compositionText, majorWorksText);
      btn.disabled = false;
      return;
    }
    await finalizePhotoIdentify(result, compositionText, majorWorksText);
  }catch(e){
    console.error('Erreur identification photo', e);
    const status2 = document.getElementById('qaPhotoStatus');
    const btn2 = document.getElementById('idPhotoBtn');
    if(status2) status2.innerHTML = '<span style="color:var(--accent);">Erreur technique : ' + esc((e && e.message) || String(e)) + '</span>';
    if(btn2) btn2.disabled = false;
  }
}
async function finalizePhotoIdentify(result, compositionText, majorWorksText){
    const newArtwork = {
      id: nextId(), additionalImages:[], myNotes:"", dateAdded: new Date().toISOString().slice(0,10),
      title: result.title, artist: result.artist,
      originalTitle: result.originalTitle || '',
      imageUrl: formMainImageData,
      movements: matchMovements(result.movements).length ? matchMovements(result.movements) : [movementKeys()[0]],
      period: result.period || '',
      technique: result.technique || '',
      description: result.description || '',
      composition: compositionText,
      anecdote: result.anecdote || '',
      tags: Array.isArray(result.tags) ? result.tags : [],
      similarArtists: result.similarArtists || '',
      museum: result.museum || '', museumCity: result.museumCity || '', museumCountry: result.museumCountry || '', museumLink: result.museumLink || ''
    };
    artworks.push(newArtwork);
    await saveArtwork(newArtwork);
    if(result.artist && !getArtist(result.artist)){
      await saveArtistRecord({
        name: result.artist, birth: result.artistBirth||'', death: result.artistDeath||'',
        nationality: result.artistNationality||'', bio: result.artistBio||'', photo:'', instagram:'',
        majorWorks: majorWorksText||'', alert: result.artistAlert||''
      });
    }
    closeForm();
    resetHomeScroll();
    showArtwork(newArtwork.id);
}

async function quickAddGenerate(){
  const title = document.getElementById('qa-title').value.trim();
  const artist = document.getElementById('qa-artist').value.trim();
  const status = document.getElementById('qaStatus');
  const btn = document.getElementById('qaGenBtn');
  if(!title || !artist){ status.innerHTML = '<span style="color:var(--accent);">Renseignez le titre et l\'artiste.</span>'; return; }
  btn.disabled = true;
  status.textContent = 'Génération en cours…';
  try{
    const result = await callArtAI(title, artist, '', '');
    const finalTitle = result.correctedTitle || title, finalArtist = result.correctedArtist || artist;
    const dup = findDuplicate(finalTitle, finalArtist);
    if(dup){
      status.innerHTML = '<span style="color:var(--accent);">« ' + esc(finalTitle) + ' » de ' + esc(finalArtist) + ' est déjà dans votre carnet (N°' + String(dup.id).padStart(3,'0') + ').</span>';
      const actions = document.createElement('div');
      actions.style.cssText = 'display:flex;gap:8px;margin-top:8px;';
      actions.innerHTML = '<button class="small-btn ghost" id="dupViewBtn">Voir la fiche existante</button><button class="small-btn ghost" id="dupForceBtn">Créer quand même</button>';
      status.appendChild(actions);
      document.getElementById('dupViewBtn').onclick = ()=>{ closeForm(); showArtwork(dup.id); };
      document.getElementById('dupForceBtn').onclick = ()=> finalizeQuickAdd(result, finalTitle, finalArtist);
      btn.disabled = false;
      return;
    }
    finalizeQuickAdd(result, finalTitle, finalArtist);
  }catch(e){
    console.error('Erreur génération IA', e);
    status.innerHTML = '<span style="color:var(--accent);">' + esc((e && e.message) || String(e)) + '</span>';
    btn.disabled = false;
  }
}
async function finalizeQuickAdd(result, finalTitle, finalArtist){
  try{
    const newArtwork = {
      id: nextId(), additionalImages:[], myNotes:"", dateAdded: new Date().toISOString().slice(0,10),
      title: finalTitle, artist: finalArtist,
      originalTitle: result.originalTitle || '',
      imageUrl: '',
      movements: matchMovements(result.movements).length ? matchMovements(result.movements) : [movementKeys()[0]],
      period: result.period || '',
      technique: result.technique || '',
      description: result.description || '',
      composition: result.composition || '',
      anecdote: result.anecdote || '',
      tags: Array.isArray(result.tags) ? result.tags : [],
      similarArtists: result.similarArtists || '',
      museum: result.museum || '', museumCity: result.museumCity || '', museumCountry: result.museumCountry || '', museumLink: result.museumLink || ''
    };
    artworks.push(newArtwork);
    await saveArtwork(newArtwork);
    if(finalArtist && !getArtist(finalArtist)){
      await saveArtistRecord({
        name: finalArtist, birth: result.artistBirth||'', death: result.artistDeath||'',
        nationality: result.artistNationality||'', bio: result.artistBio||'', photo:'', instagram:'',
        majorWorks: result.artistMajorWorks||'', alert: result.artistAlert||''
      });
    }
    closeForm();
    resetHomeScroll();
    showArtwork(newArtwork.id);
  }catch(e){
    console.error('Erreur génération IA', e);
    const status = document.getElementById('qaStatus');
    const btn = document.getElementById('qaGenBtn');
    if(status) status.innerHTML = '<span style="color:var(--accent);">' + esc((e && e.message) || String(e)) + '</span>';
    if(btn) btn.disabled = false;
  }
}

function fillIfEmpty(id, value){
  const el = document.getElementById(id);
  if(el && !el.value.trim() && value !== undefined && value !== null && String(value).trim()) el.value = value;
}
async function generateWithAI(){
  const title = document.getElementById('f-title').value.trim();
  const artist = document.getElementById('f-artist').value.trim();
  const status = document.getElementById('aiGenStatus');
  const btn = document.getElementById('aiGenBtn');
  if(!title || !artist){ status.innerHTML = '<span style="color:var(--accent);">Renseignez au moins le titre et l\'artiste avant de générer.</span>'; return; }
  const movementVal = [...document.querySelectorAll('.f-movement-cb:checked')].map(cb=>cb.value).join(', ');
  const periodVal = document.getElementById('f-period').value.trim();
  btn.disabled = true;
  status.textContent = 'Génération en cours…';
  try{
    const result = await callArtAI(title, artist, movementVal, periodVal);
    if(result.correctedTitle) document.getElementById('f-title').value = result.correctedTitle;
    if(result.correctedArtist) document.getElementById('f-artist').value = result.correctedArtist;
    matchMovements(result.movements).forEach(m => {
      const cb = document.querySelector('.f-movement-cb[value="'+m+'"]');
      if(cb) cb.checked = true;
    });
    fillIfEmpty('f-description', result.description);
    fillIfEmpty('f-composition', result.composition);
    fillIfEmpty('f-similar', result.similarArtists);
    fillIfEmpty('f-technique', result.technique);
    fillIfEmpty('f-anecdote', result.anecdote);
    fillIfEmpty('f-museum', result.museum);
    fillIfEmpty('f-city', result.museumCity);
    fillIfEmpty('f-country', result.museumCountry);
    fillIfEmpty('f-museumlink', result.museumLink);
    fillIfEmpty('f-originaltitle', result.originalTitle);
    const finalArtistName = document.getElementById('f-artist').value.trim();
    if(finalArtistName && !getArtist(finalArtistName)){
      await saveArtistRecord({
        name: finalArtistName, birth: result.artistBirth||'', death: result.artistDeath||'',
        nationality: result.artistNationality||'', bio: result.artistBio||'', photo:'', instagram:'',
        majorWorks: result.artistMajorWorks||'', alert: result.artistAlert||''
      });
    }
    const tagsField = document.getElementById('f-tags');
    if(tagsField && !tagsField.value.trim() && Array.isArray(result.tags)) tagsField.value = result.tags.join(', ');

    status.textContent = "Champs complétés (titre/artiste corrigés si besoin) — vérifiez les dates et détails précis avant d'enregistrer.";
  }catch(e){
    console.error('Erreur génération IA', e);
    status.textContent = "Erreur : " + ((e && e.message) || String(e));
  }
  btn.disabled = false;
}

function closeForm(){ document.getElementById('overlay').classList.remove('open'); editingId=null; formMainImageData=null; }

async function submitForm(){
  const title = document.getElementById('f-title').value.trim();
  const artist = document.getElementById('f-artist').value.trim();
  if(!title || !artist){
    const el = document.getElementById('mainImageZone');
    if(el) el.insertAdjacentHTML('beforebegin', '<div style="color:var(--accent);font-size:12px;margin-bottom:8px;">Le titre et le nom de l\'artiste sont nécessaires.</div>');
    return;
  }
  const urlField = document.getElementById('f-image').value.trim();
  const data = {
    title, artist,
    originalTitle: document.getElementById('f-originaltitle').value.trim(),
    imageUrl: formMainImageData || urlField,
    movements: [...document.querySelectorAll('.f-movement-cb:checked')].map(cb=>cb.value),
    period: document.getElementById('f-period').value.trim(),
    technique: document.getElementById('f-technique').value.trim(),
    description: document.getElementById('f-description').value.trim(),
    composition: document.getElementById('f-composition').value.trim(),
    anecdote: document.getElementById('f-anecdote').value.trim(),
    tags: document.getElementById('f-tags').value.split(',').map(t=>t.trim()).filter(Boolean),
    similarArtists: document.getElementById('f-similar').value.trim(),
    museum: document.getElementById('f-museum').value.trim(),
    museumCity: document.getElementById('f-city').value.trim(),
    museumCountry: document.getElementById('f-country').value.trim(),
    museumLink: document.getElementById('f-museumlink').value.trim(),
  };
  const currentEditingId = editingId;
  if(!currentEditingId){
    const dup = findDuplicate(title, artist);
    if(dup){
      showConfirm('« ' + title + ' » de ' + artist + ' est déjà dans votre carnet (N°' + String(dup.id).padStart(3,'0') + '). Créer quand même un doublon ?', async ()=>{
        await finishSubmitForm(data, currentEditingId);
      });
      return;
    }
  }
  await finishSubmitForm(data, currentEditingId);
}
async function finishSubmitForm(data, editingIdAtSubmit){
  let updated;
  if(editingIdAtSubmit){
    const idx = artworks.findIndex(x=>x.id===editingIdAtSubmit);
    updated = artworks[idx] = {...artworks[idx], ...data};
    await saveArtwork(updated);
  } else {
    updated = { id: nextId(), additionalImages:[], myNotes:"", dateAdded: new Date().toISOString().slice(0,10), ...data };
    artworks.push(updated);
    await saveArtwork(updated);
  }
  closeForm();
  if(editingIdAtSubmit){ showArtwork(editingIdAtSubmit); } else { homeFilter={type:null,value:null}; goHome(); }
}
async function deleteArtwork(id){
  showConfirm("Supprimer définitivement cette œuvre de votre carnet ?", async ()=>{
    const success = await deleteArtworkStorage(id);
    if(success){
      artworks = artworks.filter(x=>x.id!==id);
      goHome();
    } else {
      showAlert("La suppression a échoué (stockage indisponible sur cet appareil) — l'œuvre n'a pas été retirée. Réessayez, ou depuis un autre appareil.");
    }
  });
}
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeForm(); });

/* ================= INIT ================= */
(async function init(){
  document.getElementById('view').innerHTML = '<div class="loading">Chargement de votre carnet…</div>';
  await loadArtworks();
  await loadArtists();
  await loadCustomMovements();
  await loadCreations();
  await migrateArtistsFromArtworks();
  render();
})();
</script>
