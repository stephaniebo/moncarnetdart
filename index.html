<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon carnet d'œuvres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --paper:#EAEDE7; --paper-card:#F4F6F1; --ink:#1F2933; --ink-soft:#5A6570; --line:#C9D0C6; --accent:#B4432E; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans',sans-serif; -webkit-font-smoothing:antialiased; }
  a { color: var(--accent); }
  .wrap { max-width: 1100px; margin:0 auto; padding: 0 20px 80px; }

  nav.top { display:flex; align-items:center; justify-content:space-between; padding: 18px 20px; border-bottom: 2px solid var(--ink); background: var(--paper); position: sticky; top:0; z-index: 30; flex-wrap: wrap; gap:10px; }
  nav.top .logo { font-family:'Fraunces',serif; font-weight:500; font-size:20px; cursor:pointer; }
  .nav-mini-artwork { display:none; align-items:center; gap:8px; cursor:pointer; overflow:hidden; }
  .nav-mini-artwork img { width:32px; height:32px; object-fit:cover; border-radius:3px; flex-shrink:0; }
  .nav-mini-artwork span { font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:180px; }
  nav.top .links { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .navbtn { background:none; border:1.5px solid var(--line); border-radius:3px; padding:7px 12px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; cursor:pointer; color:var(--ink-soft); }
  .navbtn:hover { border-color:var(--ink); color:var(--ink); }
  .navbtn.primary { background:var(--accent); color:white; border-color:var(--accent); font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:13px; }

  .movement-menu { position:relative; }
  .movement-dropdown { display:none; position:absolute; right:0; top:36px; background:var(--paper-card); border:1.5px solid var(--ink); border-radius:3px; min-width:200px; max-height:70vh; overflow-y:auto; z-index:40; }
  .movement-dropdown.open { display:block; }
  .movement-dropdown button { display:block; width:100%; text-align:left; padding:10px 14px; border:none; background:none; font-family:'IBM Plex Sans',sans-serif; font-size:13px; cursor:pointer; color:var(--ink); border-bottom:1px solid var(--line); }
  .movement-dropdown button:last-child{border-bottom:none;}
  .movement-dropdown button:hover { background:var(--paper); }

  #view { padding-top: 24px; }
  .loading { text-align:center; padding:60px 0; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:13px; }

  .home-toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .home-toolbar h1 { font-family:'Fraunces',serif; font-size:26px; font-weight:500; margin:0; }
  .chip-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .chip { padding:7px 13px; border-radius:14px; border:1.5px solid var(--line); background:var(--paper-card); font-family:'IBM Plex Mono',monospace; font-size:11.5px; cursor:pointer; color:var(--ink-soft); }
  .chip:hover { border-color:var(--ink); color:var(--ink); }
  .chip.active { color:white; border-color:transparent; }
  .active-filter-note { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; font-family:'IBM Plex Mono',monospace; }
  .active-filter-note button { background:none; border:none; color:var(--accent); cursor:pointer; text-decoration:underline; font-family:'IBM Plex Mono',monospace; font-size:12px; }
  .home-grid { columns: 4 220px; column-gap: 10px; }
  .home-grid img { width:100%; display:block; margin-bottom:10px; border-radius:2px; cursor:pointer; break-inside: avoid; transition: transform .15s ease, filter .15s ease; }
  .home-grid img:hover { transform: scale(1.015); filter:brightness(0.94); }
  .empty-state { text-align:center; padding: 80px 20px; color:var(--ink-soft); }
  .empty-state h2 { font-family:'Fraunces',serif; color:var(--ink); font-weight:500; }

  .back { background:none; border:none; cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); margin-bottom:16px; padding:0;}
  .back:hover{color:var(--ink);}
  .detail-head { display:flex; gap:26px; flex-wrap:wrap; margin-bottom: 30px; }
  .detail-images { flex: 0 1 380px; min-width: 260px; }
  .main-image-wrap { position:relative; }
  .main-image { width:100%; border-radius:3px; display:block; background: var(--paper-card); min-height:200px; object-fit:cover; }
  .add-main-image-btn { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:white; border:1.5px solid var(--ink); border-radius:3px; padding:10px 16px; font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:13px; cursor:pointer; color:var(--ink); box-shadow:0 4px 14px rgba(31,41,51,.25); }
  .add-main-image-btn:hover { background:var(--ink); color:white; }
  .thumb-row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .thumb-row img { width:60px; height:60px; object-fit:cover; border-radius:2px; cursor:pointer; border:1.5px solid var(--line); }
  .thumb-row .add-photo { width:60px; height:60px; border:1.5px dashed var(--line); border-radius:2px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); font-size:20px; background:none;}
  .detail-facts { flex: 1 1 300px; min-width: 260px; }
  .catalog-tag { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); }
  .detail-facts h1 { font-family:'Fraunces',serif; font-weight:500; font-size:32px; margin: 4px 0 0; line-height:1.12; }
  .original-title { font-size:14px; color:var(--ink-soft); font-style:italic; margin: 2px 0 12px; }
  .artist-line { font-size:15px; margin-bottom:14px; }
  .a-link { cursor:pointer; border-bottom:1px solid var(--accent); color:var(--accent); }
  .artist-line .a-link { font-weight:500; }
  .movement-badge { display:inline-block; padding:5px 12px; border-radius:12px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:white; cursor:pointer; margin-bottom:16px; border:none; }
  .field-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px 20px; font-size:13px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:12px 0; margin-bottom:16px; }
  .field-grid div span.k { display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:2px; }
  .museum-box { background:var(--paper-card); border:1px solid var(--line); border-radius:3px; padding:12px 14px; font-size:13px; }
  .museum-box .k { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; }

  .detail-body { display:flex; flex-direction:column; }
  .section { padding: 26px 0; border-top: 1px solid var(--line); }
  .section:first-child { border-top: 2px solid var(--ink); }
  .section-title { font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin: 0 0 14px; display:flex; justify-content:space-between; align-items:center;}
  .text-block { font-size:15.5px; line-height:1.8; max-width: 760px; }
  .text-block p { margin: 0 0 14px; }
  .tags { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:16px; }
  .tags span { font-size:11px; padding:4px 11px; background:var(--paper); border:1px solid var(--line); border-radius:12px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; cursor:pointer; }
  .tags span:hover { border-color:var(--accent); color:var(--accent); }

  .artist-box { display:flex; gap:16px; align-items:flex-start; }
  .artist-photo { width:80px; height:80px; border-radius:50%; object-fit:cover; flex-shrink:0; background:var(--line); }
  .artist-box .meta-line { font-size:12.5px; color:var(--ink-soft); margin: 2px 0 10px; }
  .similar-list span.artist-chip { cursor:pointer; border-bottom:1px dotted var(--accent); color:var(--accent); margin-right:4px;}
  .similar-list span.plain { color:var(--ink-soft); margin-right:4px; }

  textarea.notes-area { width:100%; max-width:760px; min-height:100px; border:1.5px solid var(--line); border-radius:3px; padding:10px 12px; font-family:'IBM Plex Sans',sans-serif; font-size:13.5px; color:var(--ink); resize:vertical; background:var(--paper-card); }
  .notes-empty { color: var(--ink-soft); font-style:italic; font-size:13px; cursor:pointer; }
  .small-btn { background:var(--ink); color:var(--paper); border:none; border-radius:3px; padding:7px 14px; font-size:12.5px; cursor:pointer; margin-top:8px; font-family:'IBM Plex Sans',sans-serif; font-weight:600;}
  .small-btn.ghost { background:none; border:1.5px solid var(--line); color:var(--ink-soft); }
  .edit-link { background:none; border:none; color:var(--accent); cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:11px; text-decoration: underline; padding:0;}

  .movement-hero { border-bottom: 2px solid var(--ink); padding-bottom: 18px; margin-bottom: 24px; }
  .movement-hero h1 { font-family:'Fraunces',serif; font-weight:500; font-size:34px; margin:0 0 4px; }
  .movement-hero .period { font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft); margin-bottom:12px; }
  .movement-hero p { font-size:14.5px; line-height:1.7; max-width:640px; }
  .chrono { margin-top:16px; display:flex; flex-direction:column; gap:6px; }
  .chrono-item { display:flex; gap:14px; font-size:13px; }
  .chrono-item .year { font-family:'IBM Plex Mono',monospace; color:var(--accent); min-width:90px; font-weight:500;}
  .movement-grid, .artist-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .movement-grid img, .artist-grid img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:2px; cursor:pointer; }
  .creation-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:16px; }
  .creation-card { cursor:pointer; }
  .creation-card img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:3px; display:block; margin-bottom:6px; }
  .creation-card .ctitle { font-family:'Fraunces',serif; font-size:13px; font-weight:500; line-height:1.3; }
  .creation-card .cstatus { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft); margin-top:2px; }

  .artist-hero { border-bottom: 2px solid var(--ink); padding-bottom: 18px; margin-bottom: 24px; }
  .artist-hero h1 { font-family:'Fraunces',serif; font-weight:500; font-size:32px; margin:0 0 4px; }
  .artist-hero .meta { font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft); margin-bottom:10px;}
  .artist-hero p { font-size:14px; line-height:1.7; max-width:640px; color:var(--ink-soft); }

  .overlay { position:fixed; inset:0; background:rgba(31,41,51,.6); display:none; align-items:flex-start; justify-content:center; padding:30px 16px; z-index:60; overflow-y:auto; }
  .overlay.open { display:flex; }
  .modal-form { background:var(--paper-card); max-width:640px; width:100%; border-radius:4px; border:1.5px solid var(--ink); padding:26px 28px 30px; margin-bottom: 40px; position:relative;}
  .modal-form h2 { font-family:'Fraunces',serif; font-weight:500; margin:0 0 4px; font-size:24px; }
  .modal-form .sub { font-size:12.5px; color:var(--ink-soft); margin-bottom:18px; }
  fieldset { border:1px solid var(--line); border-radius:3px; margin-bottom:14px; padding:12px 14px 14px; }
  legend { font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); padding:0 6px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  label { display:block; font-size:11.5px; color:var(--ink-soft); margin: 8px 0 3px; font-family:'IBM Plex Mono',monospace;}
  input[type=text], input[type=number], input[type=url], select, textarea { width:100%; padding:9px 10px; border:1.5px solid var(--line); border-radius:3px; font-family:'IBM Plex Sans',sans-serif; font-size:13.5px; background:white; color:var(--ink); }
  textarea { resize:vertical; min-height:60px; }
  .form-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
  .close-x { position:absolute; top:14px; right:16px; background:none; border:none; font-size:18px; cursor:pointer; color:var(--ink-soft); }

  .zoom-overlay { position:fixed; inset:0; background:rgba(15,15,15,.96); z-index:200; display:none; overflow:auto; }
  .zoom-overlay.open { display:block; }
  .zoom-overlay .zoom-close { position:fixed; top:16px; right:16px; width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.92); border:none; font-size:20px; cursor:pointer; z-index:201; }
  .zoom-inner { min-height:100%; display:flex; align-items:center; justify-content:center; padding:20px; box-sizing:border-box; }
  .zoom-inner img { max-width:100%; max-height:calc(100vh - 40px); cursor:zoom-in; display:block; }
  .zoom-inner img.zoomed { max-width:none; max-height:none; width:auto; cursor:zoom-out; }
  .main-image-wrap img.main-image { cursor:zoom-in; }

  .image-zone { border:1.5px dashed var(--line); border-radius:4px; padding:12px; text-align:center; cursor:pointer; outline:none; background:white; }
  .image-zone:focus { border-color:var(--accent); }
  .image-zone .zone-text { font-size:12px; color:var(--ink-soft); line-height:1.6; }
  .image-zone img.zone-preview { max-width:100%; max-height:160px; border-radius:3px; display:block; margin:0 auto 8px; }
  .zone-actions { display:flex; gap:8px; justify-content:center; margin-top:8px; flex-wrap:wrap; }
  .or-sep { font-size:11px; color:var(--ink-soft); margin: 8px 0 4px; }

  @media (max-width:640px){
    .field-grid, .row2 { grid-template-columns: 1fr; }
    .home-grid { columns: 2 140px; }
    .detail-facts h1 { font-size:26px; }
  }
</style>
</head>
<body>
<nav class="top">
  <div class="logo" onclick="goHome()">Mon carnet d'œuvres</div>
  <div class="nav-mini-artwork" id="navMiniArtwork" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <img id="navMiniImg" src="" alt="">
    <span id="navMiniTitle"></span>
  </div>
  <div class="links">
    <button class="navbtn" onclick="goHome()" style="background:#2B6E63;color:white;border-color:#2B6E63;font-weight:600;">Galerie</button>
    <button class="navbtn" onclick="showAllMovements()">Courants</button>
    <button class="navbtn" onclick="showArtistsByMovement()">Artistes</button>
    <button class="navbtn" onclick="showCreations()">Mes œuvres</button>
    <div class="movement-menu">
      <button class="navbtn" id="moreMenuBtn">⋯</button>
      <div class="movement-dropdown" id="moreDropdown">
        <button onclick="exportData()">Exporter (.json)</button>
        <button onclick="document.getElementById('importFile').click()">Importer (.json)</button>
        <button onclick="downloadAllImages()">Télécharger les images (.zip)</button>
        <button onclick="openDuplicateManager()">Gérer les doublons</button>
      </div>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none">
    <button class="navbtn primary" onclick="openForm()">+ Ajouter une œuvre</button>
  </div>
</nav>

<div class="wrap"><div id="view"><div class="loading">Chargement de votre carnet…</div></div></div>
<div class="overlay" id="overlay"><div id="overlayContent"></div></div>
<div class="zoom-overlay" id="imageZoomOverlay">
  <button class="zoom-close" onclick="closeImageZoom()">✕</button>
  <div class="zoom-inner"><img id="zoomImg" src="" alt="" onclick="toggleZoomImg(event)"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ================= MOVEMENTS ================= */
const MOVEMENTS = {
  "Art préhistorique": { parent:null, keyArtists:[], origin:"Europe (grottes ornées)", color:"#5A4A3D", period:"env. -40 000 à -3 000",
    desc:"Premières manifestations artistiques humaines : peintures pariétales animalières au Paléolithique, puis mégalithisme et art des premiers agriculteurs au Néolithique.",
    chrono:[["-40 000 à -10 000","Art pariétal du Paléolithique (Lascaux, Chauvet)"],["-10 000 à -3 000","Mégalithisme néolithique, premiers villages agricoles"]] },
  "Art égyptien": { parent:null, keyArtists:[], origin:"Égypte antique", color:"#B8862E", period:"env. -3000 à -30",
    desc:"Art au service religieux et funéraire, régi par des codes de représentation stables sur près de trois millénaires : frontalité du corps, hiérarchie des tailles selon le rang, hiéroglyphes intégrés à l'image.",
    chrono:[["Ancien Empire","Pyramides de Gizeh, canon rigide de la représentation du corps"],["Moyen Empire","Consolidation des codes funéraires"],["Nouvel Empire","Apogée artistique (Toutânkhamon, temples de Karnak)"],["-30","Annexion par Rome, fin de l'Égypte pharaonique"]] },
  "Art mésopotamien": { parent:null, keyArtists:[], origin:"Mésopotamie (Irak actuel)", color:"#8C6B4A", period:"env. -3500 à -539",
    desc:"Art des civilisations sumérienne, akkadienne, babylonienne et assyrienne : bas-reliefs narratifs, stèles de lois, figures hybrides colossales gardiennes de palais.",
    chrono:[["-3500","Émergence des cités-États sumériennes"],["-1750","Stèle du Code d'Hammurabi"],["-9e-7e s.","Bas-reliefs assyriens (palais de Ninive)"],["-539","Chute de Babylone, conquête perse"]] },
  "Art étrusque": { parent:null, keyArtists:[], origin:"Étrurie (Italie centrale)", color:"#9E5A4A", period:"env. -800 à -300",
    desc:"Art funéraire vif et coloré, influencé par la Grèce archaïque mais gardant une expressivité propre : fresques de tombes, sarcophages en terre cuite aux figures souriantes.",
    chrono:[["-800","Émergence de la civilisation étrusque"],["-6e s.","Apogée des tombes peintes de Tarquinia"],["-300","Absorption progressive par Rome"]] },
  "Antiquité": { parent:null, keyArtists:[], origin:"Grèce, puis Rome", color:"#8A7355", period:"VIIIe s. av. J.-C. – Ve s. apr. J.-C.",
    desc:"Sculpture et architecture grecques puis romaines, qui posent les fondements de l'art occidental : recherche de l'idéal du corps, équilibre des proportions, passage progressif d'une rigidité archaïque à un naturalisme de plus en plus expressif.",
    chrono:[["VIIIe-VIe s. av. J.-C.","Période archaïque, figures rigides et frontales (kouroi)"],["Ve s. av. J.-C.","Classicisme grec, canon idéal du corps (Phidias, Polyclète)"],["IVe-Ier s. av. J.-C.","Période hellénistique, mouvement et émotion exacerbés"],["Ier s. av.-Ve s. apr. J.-C.","Rome copie et diffuse les modèles grecs dans tout l'Empire"]] },
  "Art roman": { parent:null, keyArtists:["Maîtres de Cluny", "Gislebertus"], origin:"Europe (France notamment)", color:"#6B6152", period:"1000 – 1150",
    desc:"Peinture murale principalement subordonnée à l'architecture religieuse : formes schématiques, cernes noirs marqués et absence de perspective spatiale.",
    chrono:[["1000s","Essor de l'art roman le long des routes de pèlerinage"],["Milieu XIe","Grands programmes de fresques murales dans les églises"],["1100s","Apogée avec des ateliers comme ceux de Cluny (Gislebertus)"],["1150","Transition progressive vers le style gothique"]] },
  "Art gothique": { parent:null, keyArtists:["Abbé Suger", "Giotto", "Duccio"], origin:"France", color:"#5A6B8C", period:"1150 – 1400",
    desc:"Style marqué par le naturalisme et l'esprit courtois : élongation des figures, élégance des lignes courbes et recherche de réalisme dans l'expression des sentiments.",
    chrono:[["1140s","Suger lance la reconstruction de Saint-Denis, berceau du style"],["1200s","Diffusion du style dans toute l'Europe via l'architecture des cathédrales"],["1300s","Giotto et Duccio introduisent profondeur et émotion dans la peinture"],["1400","Transition vers la Renaissance"]] },
  "Art paléochrétien": { parent:null, keyArtists:[], origin:"Empire romain", color:"#6E5A8C", period:"env. 200 à 500",
    desc:"Premier art chrétien, développé dans la clandestinité puis officiellement après 313 : catacombes peintes, sarcophages sculptés, symboles codés (poisson, bon pasteur) précédant l'iconographie byzantine.",
    chrono:[["200-300","Fresques des catacombes romaines"],["313","Édit de Milan, légalisation du christianisme"],["400s","Premières basiliques et leurs mosaïques"]] },
  "Art byzantin": { parent:null, keyArtists:[], origin:"Empire byzantin (Constantinople)", color:"#A38A3D", period:"330 – 1453",
    desc:"Art religieux hiératique et doré, fondé sur la frontalité, l'aplat et la lumière transcendante des mosaïques et des icônes, pensé comme fenêtre vers le divin plutôt que représentation du réel.",
    chrono:[["330","Fondation de Constantinople par Constantin"],["532-37","Construction de Sainte-Sophie"],["726-843","Crise iconoclaste, interdiction temporaire des images"],["1453","Chute de Constantinople"]] },
  "Art préroman": { parent:null, keyArtists:[], origin:"Europe carolingienne et ottonienne", color:"#7A6B52", period:"env. 750 à 1000",
    desc:"Art de transition après les invasions, porté par les cours carolingienne puis ottonienne : manuscrits enluminés somptueux, orfèvrerie religieuse, architecture annonçant le style roman.",
    chrono:[["800","Couronnement de Charlemagne, renaissance carolingienne"],["9e s.","Grands ateliers d'enluminure (École de Reims)"],["10e s.","Renaissance ottonienne en Allemagne"]] },
  "Primitifs (flamands et italiens)": { parent:null, keyArtists:[], origin:"Flandre et Italie", color:"#6B7A5A", period:"env. 1350 à 1450",
    desc:"Génération charnière entre gothique tardif et Renaissance : minutie du détail, usage naissant de la peinture à l'huile en Flandre, premières recherches de profondeur en Italie.",
    chrono:[["1350s","Derniers feux du gothique international"],["1420s","Van Eyck perfectionne la peinture à l'huile en Flandre"],["1450","Transition vers le Quattrocento et la Renaissance nordique"]] },
  "Renaissance": { parent:null, keyArtists:["Léonard de Vinci", "Raphaël"], origin:"Italie", color:"#7A5A3A", period:"1400 – 1520",
    desc:"Renouveau artistique fondé sur l'humanisme et la redécouverte de l'antique : maîtrise de la perspective linéaire, de l'anatomie scientifique et du modelé par la lumière (sfumato).",
    chrono:[["1420s","Brunelleschi formalise la perspective linéaire à Florence"],["1480s","Botticelli peint des scènes mythologiques profanes"],["1500s","Haute Renaissance : Léonard de Vinci, Michel-Ange, Raphaël"],["1520s","Transition vers le maniérisme"]] },
  "Renaissance nordique": { parent:"Renaissance", keyArtists:["Van Eyck", "Bruegel"], origin:"Flandre, Pays-Bas", color:"#5A7A6E", period:"1420 – 1570",
    desc:"Renaissance septentrionale, moins tournée vers l'antique que l'italienne : minutie quasi photographique du détail, huile en glacis superposés, scènes de genre et paysages inédits en Europe.",
    chrono:[["1420s","Van Eyck systématise la peinture à l'huile en glacis"],["1500s","Bosch peint ses visions fantastiques et morales"],["1560s","Bruegel l'Ancien peint les scènes paysannes et proverbes flamands"]] },
  "Maniérisme": { parent:"Renaissance", keyArtists:["Pontormo", "Le Parmesan"], origin:"Italie", color:"#9E6B4A", period:"1520 – 1580",
    desc:"Né d'une crise de l'harmonie renaissante, ce style privilégie des compositions instables, des figures aux membres allongés (figura serpentinata) et des couleurs parfois acides ou arbitraires.",
    chrono:[["1520","Mort de Raphaël, souvent vue comme le point de bascule"],["1530-40s","Pontormo et Le Parmesan développent l'élongation des figures"],["1550s","Diffusion du maniérisme dans les cours européennes"],["1580","Transition vers le baroque"]] },
  "Ténébrisme (caravagisme)": { parent:"Baroque", keyArtists:["Le Caravage"], origin:"Italie", color:"#3D3D3D", period:"1600 – 1650",
    desc:"Usage radical du clair-obscur, popularisé par le Caravage : figures surgissant d'un fond presque noir, éclairées par une lumière crue et dramatique, sujets religieux traités avec un réalisme cru.",
    chrono:[["1600","Le Caravage impose son style à Rome"],["1610","Mort du Caravage, diffusion de son influence en Europe"],["1630s","Artemisia Gentileschi prolonge le style en Italie"]] },
  "Baroque": { parent:null, keyArtists:["Le Caravage", "Le Bernin"], origin:"Italie, puis Flandre et Europe", color:"#6E3D3D", period:"1580 – 1750",
    desc:"Triomphe de la courbe et de la théâtralité : compositions en diagonale, effets de mouvement, emphase décorative et contrastes violents de clair-obscur, souvent au service de l'Église ou des monarchies.",
    chrono:[["1600s","Caravage impose le clair-obscur dramatique à Rome"],["1620s","Rubens domine la peinture baroque flamande"],["1650s","Le Bernin transforme Rome par sa sculpture et son architecture"],["Fin XVIIe","Le style s'exporte et se politise dans les cours européennes"]] },
  "Âge d'or néerlandais": { parent:"Baroque", keyArtists:["Vermeer", "Rembrandt"], origin:"Pays-Bas", color:"#4A6B7A", period:"1600 – 1680",
    desc:"Apogée de la peinture hollandaise protestante et bourgeoise : scènes d'intérieur silencieuses, natures mortes, portraits de groupe, sans commande religieuse ou royale, destinés à un marché privé inédit.",
    chrono:[["1600s","Essor d'un marché de l'art bourgeois indépendant de l'Église"],["1632","Rembrandt peint La Leçon d'anatomie du docteur Tulp"],["1665","Vermeer peint La Jeune Fille à la perle"],["1680","Déclin progressif avec la crise économique néerlandaise"]] },
  "Classicisme": { parent:null, keyArtists:["Nicolas Poussin", "Charles Le Brun"], origin:"France", color:"#5A7A6E", period:"1660 – 1715",
    desc:"Doctrine défendue par l'Académie royale : primauté du dessin sur la couleur, clarté de la composition et idéal de mesure directement inspiré de l'antique.",
    chrono:[["1648","Fondation de l'Académie royale de peinture et de sculpture"],["1660s","Poussin devient la référence théorique du mouvement"],["1680s","Le Brun dirige les grands décors de Versailles"],["1715","Mort de Louis XIV, déclin progressif au profit du rococo"]] },
  "Rococo": { parent:null, keyArtists:["Antoine Watteau", "Jean-Honoré Fragonard"], origin:"France", color:"#C48A9E", period:"1715 – 1750",
    desc:"Réaction légère et sensuelle contre le « grand style » du règne de Louis XIV : touche divisée, tons pastels et thématiques galantes, champêtres ou frivoles.",
    chrono:[["1715","Mort de Louis XIV, libération des mœurs artistiques sous la Régence"],["1720-30s","Watteau invente les « fêtes galantes »"],["1740s","Fragonard prolonge l'esprit rococo"],["1750","Montée du néoclassicisme en réaction contre la frivolité rococo"]] },
  "Néoclassicisme": { parent:null, keyArtists:["Jacques-Louis David", "Ingres"], origin:"France", color:"#A38A3D", period:"1750 – 1830",
    desc:"Réaction contre les excès décoratifs du rococo : facture lisse, linéarité du dessin et sujets exaltant le civisme et l'héroïsme, en écho aux idéaux révolutionnaires puis impériaux.",
    chrono:[["1760s","Redécouverte archéologique de Pompéi, engouement pour l'antique"],["1784","Le Serment des Horaces de David, manifeste du style"],["1793-1815","Art officiel de la Révolution puis de l'Empire"],["1820s","Déclin progressif face à la montée du romantisme"]] },
  "Romantisme": { parent:null, keyArtists:["Eugène Delacroix", "Caspar David Friedrich"], origin:"France, puis Europe", color:"#3A5A7A", period:"1770 – 1850",
    desc:"Mouvement né en réaction au classicisme rigide, qui privilégie l'émotion, le sublime, le drame et souvent l'engagement politique, à travers une touche plus libre et un usage expressif de la lumière et de la couleur.",
    chrono:[["1780-90s","Émergence en réaction au néoclassicisme"],["1818-19","Le Radeau de la Méduse de Géricault, scandale politique"],["1830","La Liberté guidant le peuple de Delacroix"],["1850s","Déclin progressif au profit du réalisme"]] },
  "Orientalisme": { parent:"Romantisme", keyArtists:["Eugène Delacroix"], origin:"France, Europe (thème transversal)", color:"#B8733D", period:"1800 – 1880",
    desc:"Représentation fantasmée de l'Orient (Maghreb, Moyen-Orient) par des artistes européens n'y ayant souvent jamais mis les pieds : harems, marchés, scènes exotiques mêlant fascination et regard colonial.",
    chrono:[["1798","Expédition d'Égypte de Bonaparte, engouement savant pour l'Orient"],["1832","Delacroix voyage au Maroc, tournant décisif du genre"],["1863","La Grande Odalisque déjà ancienne devient une référence du genre"]] },
  "Académisme (peinture pompier)": { parent:null, keyArtists:["William Bouguereau"], origin:"France", color:"#8C7A4A", period:"1850 – 1900",
    desc:"Peinture officielle enseignée par l'École des Beaux-Arts et validée par les Salons : sujets mythologiques ou historiques, exécution lisse et léchée, longtemps opposée puis éclipsée par les avant-gardes.",
    chrono:[["1850s","Domination des Salons officiels par ce style"],["1863","Salon des Refusés, première fissure face aux avant-gardes"],["1900","Déclassement progressif au profit de l'impressionnisme et au-delà"]] },
  "École de Barbizon": { parent:"Réalisme", keyArtists:["Millet", "Corot"], origin:"France", color:"#5A6B4A", period:"1830 – 1870",
    desc:"Groupe de paysagistes installés près de la forêt de Fontainebleau, peignant sur le motif en pleine nature plutôt qu'en atelier — une étape clé vers l'impressionnisme.",
    chrono:[["1830s","Installation des premiers peintres à Barbizon"],["1848-70","Apogée du groupe autour de Millet et Corot"],["Héritage","Influence directe sur Monet et les impressionnistes"]] },
  "Réalisme": { parent:null, keyArtists:["Gustave Courbet", "Jean-François Millet"], origin:"France", color:"#5A5A4A", period:"1848 – 1875",
    desc:"Mouvement fondé sur l'observation directe du fait social, qui rejette l'idéalisation académique au profit d'une représentation frontale des classes populaires, dans des couleurs souvent terreuses et sombres.",
    chrono:[["1848","Contexte révolutionnaire, essor d'un art socialement engagé"],["1855","Courbet organise son propre « Pavillon du Réalisme »"],["1857","Millet peint Les Glaneuses, symbole du mouvement"],["1870s","Influence directe sur les débuts de l'impressionnisme"]] },
  "Préraphaélisme": { parent:null, keyArtists:["Dante Gabriel Rossetti", "John Everett Millais"], origin:"Angleterre", color:"#8C4A5A", period:"1848 – 1860",
    desc:"Confrérie britannique prônant un retour à la minutie et à la pureté de l'art antérieur à Raphaël : couleurs saturées, détails botaniques précis, sujets littéraires ou moyenâgeux traités avec une intensité quasi mystique.",
    chrono:[["1848","Fondation de la Confrérie préraphaélite (Rossetti, Millais, Hunt)"],["1852","Millais peint Ophelia"],["1860","Dissolution officielle, influence prolongée sur l'Art nouveau"]] },
  "Impressionnisme": { parent:null, keyArtists:["Claude Monet", "Auguste Renoir"], origin:"France", color:"#4A7A9E", period:"1874 – 1886",
    desc:"Mouvement pictural né en réaction à la peinture académique : touches visibles et divisées, sujets pris sur le vif (paysages, scènes urbaines), fascination pour les effets changeants de la lumière plutôt que pour le contour précis des formes.",
    chrono:[["1874","Première exposition du groupe, d'où le nom (moqué à l'origine)"],["1870s","Monet, Renoir, Pissarro peignent en extérieur, sur le motif"],["1880s","Divergences internes, le groupe se disperse progressivement"],["1886","Dernière exposition impressionniste collective"]] },
  "Néo-impressionnisme (Pointillisme)": { parent:"Impressionnisme", keyArtists:["Georges Seurat", "Paul Signac"], origin:"France", color:"#3D8CA3", period:"1885 – 1900",
    desc:"Systématisation scientifique de la touche impressionniste : juxtaposition de petits points de couleur pure censés se mélanger optiquement dans l'œil du spectateur plutôt que sur la palette.",
    chrono:[["1884","Fondation du Salon des Indépendants"],["1886","Seurat expose Un dimanche après-midi à la Grande Jatte"],["1890s","Signac théorise et prolonge la méthode divisionniste"]] },
  "Post-impressionnisme": { parent:"Impressionnisme", keyArtists:["Vincent van Gogh", "Paul Cézanne", "Paul Gauguin"], origin:"France", color:"#8C5B8C", period:"1886 – ~1905",
    desc:"Génération d'artistes qui part de l'impressionnisme mais le juge trop attaché à la simple impression visuelle : retour à la construction, à la couleur expressive ou symbolique, à une charge émotionnelle et personnelle plus forte.",
    chrono:[["1886","Dernière expo impressionniste, dispersion du groupe initial"],["1888","Van Gogh peint à Arles, couleurs intenses et touche tourmentée"],["1889","La Nuit étoilée, peinte à l'asile de Saint-Rémy"],["1890s","Cézanne et Seurat ouvrent la voie au cubisme et à l'art moderne"]] },
  "Symbolisme": { parent:null, keyArtists:["Gustav Klimt", "Edvard Munch", "Gustave Moreau"], origin:"France, Autriche, international", color:"#6B4A7A", period:"1885 – 1910",
    desc:"Réaction contre le réalisme et l'impressionnisme : l'art devient suggestion d'idées, de rêves et d'états d'âme plutôt que description du monde visible, souvent via des figures mythologiques ou érotico-mystiques.",
    chrono:[["1886","Manifeste symboliste de Jean Moréas"],["1890s","Moreau et Munch développent une imagerie intérieure et anxieuse"],["1900s","Klimt porte le symbolisme viennois à son apogée décorative"]] },
  "Nabis": { parent:"Post-impressionnisme", keyArtists:["Pierre Bonnard", "Édouard Vuillard"], origin:"France", color:"#A3733D", period:"1888 – 1900",
    desc:"Groupe de peintres se voulant « prophètes » (nabi en hébreu) d'un art nouveau : aplats colorés, cernes marqués, influence de l'estampe japonaise, frontière brouillée entre peinture et arts décoratifs.",
    chrono:[["1888","Sérusier peint Le Talisman sous la direction de Gauguin"],["1890s","Bonnard et Vuillard développent les scènes d'intérieur intimistes"],["1900","Dissolution du groupe, chacun poursuivant seul"]] },
  "Art naïf": { parent:null, keyArtists:["Henri Rousseau"], origin:"International (transversal)", color:"#4A8C6B", period:"à partir de 1885",
    desc:"Peinture d'artistes autodidactes, sans formation académique : perspective intuitive plutôt que scientifique, couleurs franches, minutie décorative — une fraîcheur que les avant-gardes ont paradoxalement admirée.",
    chrono:[["1885","Début de l'activité picturale du douanier Henri Rousseau"],["1900s","Reconnaissance progressive par les cercles d'avant-garde parisiens"],["20e s.","Le terme s'étend à des artistes autodidactes du monde entier"]] },
  "Sécession viennoise": { parent:"Symbolisme", keyArtists:["Gustav Klimt"], origin:"Autriche", color:"#B8A33D", period:"1897 – 1905",
    desc:"Groupe d'artistes viennois rompant avec l'art académique officiel, prônant un art total mêlant peinture, décoration et architecture, dans une esthétique dorée et ornementale propre à Klimt.",
    chrono:[["1897","Fondation de la Sécession viennoise, Klimt en est le premier président"],["1902","Frise Beethoven de Klimt, hommage au compositeur"],["1905","Klimt quitte le mouvement après des tensions internes"]] },
  "Fauvisme": { parent:null, keyArtists:["Henri Matisse", "André Derain"], origin:"France", color:"#D97B29", period:"1905 – 1910",
    desc:"Libération de la couleur pure : usage de teintes éclatantes et arbitraires, simplification des formes et refus du modelé traditionnel, pour restituer une émotion plutôt qu'une réalité optique fidèle.",
    chrono:[["1905","Salon d'Automne : le critique Louis Vauxcelles qualifie ironiquement les artistes de « fauves »"],["1905-07","Apogée du mouvement autour de Matisse, Derain, Vlaminck"],["1907","Matisse et Derain s'orientent vers d'autres recherches, dispersion du groupe"],["Héritage","Influence directe sur l'expressionnisme allemand naissant"]] },
  "Expressionnisme": { parent:null, keyArtists:["Ernst Ludwig Kirchner", "Edvard Munch"], origin:"Allemagne", color:"#A63D3D", period:"1905 – 1930",
    desc:"Projection de l'angoisse et de l'émotion intérieure de l'artiste par la déformation de la réalité, des cernes marqués, des couleurs violentes et une intensité psychologique brute.",
    chrono:[["1905","Fondation du groupe Die Brücke à Dresde"],["1911","Fondation du groupe Der Blaue Reiter à Munich"],["1920s","L'expressionnisme s'étend au cinéma et à la scène allemande"],["1930s","Le mouvement est réprimé par le régime nazi comme « art dégénéré »"]] },
  "Futurisme": { parent:null, keyArtists:["Umberto Boccioni", "Giacomo Balla"], origin:"Italie", color:"#C4622E", period:"1904 – 1920",
    desc:"Culte de la vitesse, de la machine et du progrès technique, traduit par la répétition des formes et la fragmentation des plans colorés en lignes de force pour suggérer le mouvement.",
    chrono:[["1909","Manifeste du futurisme de Marinetti, publié à Paris"],["1910","Manifeste des peintres futuristes signé par Boccioni et Balla"],["1912","Exposition futuriste à Paris, contact direct avec le cubisme"],["1920","Déclin du mouvement après la Première Guerre mondiale"]] },
  "Cubisme": { parent:null, keyArtists:["Pablo Picasso", "Georges Braque"], origin:"France", color:"#B8862E", period:"1907 – 1914",
    desc:"Déconstruction de l'espace classique et du volume : représentation simultanée de l'objet sous plusieurs angles, géométrisation et analyse des formes par plans, abandonnant la perspective unique.",
    chrono:[["1907","Les Demoiselles d'Avignon (Picasso)"],["1908-12","Cubisme analytique : décomposition des formes"],["1912-14","Cubisme synthétique : collages, papiers collés"],["Après 1918","Influence sur l'Art déco et le futurisme"]] },
  "Orphisme": { parent:"Cubisme", keyArtists:["Robert Delaunay", "Sonia Delaunay"], origin:"France", color:"#6B8C3D", period:"1912 – 1914",
    desc:"Branche du cubisme qui met l'accent sur la couleur pure et la construction par contrastes chromatiques plutôt que sur la géométrie des volumes, se rapprochant d'une abstraction lyrique et quasi musicale.",
    chrono:[["1912","Guillaume Apollinaire invente le terme « orphisme », en référence au poète mythique Orphée"],["1912-13","Robert et Sonia Delaunay développent les séries « Formes circulaires » et « Disques »"],["1913","Exposition à la galerie Der Sturm à Berlin, diffusion en Allemagne"],["1914","Le mouvement s'estompe avec le début de la Première Guerre mondiale"]] },
  "Cubo-futurisme": { parent:"Cubisme", keyArtists:["Kasimir Malevitch", "Natalia Gontcharova"], origin:"Russie", color:"#9E3D5A", period:"1912 – 1915",
    desc:"Fusion russe du cubisme français, qui décompose les formes en facettes géométriques, et du futurisme italien, qui célèbre le mouvement et la vitesse — un croisement qui ouvrira directement la voie à l'avant-garde russe.",
    chrono:[["1912","Premières œuvres cubo-futuristes en Russie, influencées par les expositions parisiennes"],["1913","L'opéra « Victoire sur le Soleil », manifeste visuel du mouvement"],["1915","Malevitch expose ses premières compositions suprématistes, dépassant le cubo-futurisme"],["Héritage","Fondement de l'avant-garde russe des années 1910-1920"]] },
  "Suprématisme": { parent:"Cubo-futurisme", keyArtists:["Kasimir Malevitch"], origin:"Russie", color:"#3D3D5A", period:"1913 – 1920",
    desc:"Radicalisation russe de l'abstraction : formes géométriques pures (carré, cercle, croix) flottant sur fond blanc, dépouillées de toute référence au monde sensible, poussant le cubo-futurisme à son terme logique.",
    chrono:[["1913","Malevitch conçoit les décors suprématistes de l'opéra Victoire sur le Soleil"],["1915","Exposition 0.10 à Petrograd, le Carré noir est dévoilé"],["1920","Le mouvement influence le Constructivisme et le Bauhaus"]] },
  "Constructivisme russe": { parent:"Suprématisme", keyArtists:["Vladimir Tatline", "Naum Gabo"], origin:"Russie/URSS", color:"#B4432E", period:"1915 – 1930",
    desc:"Art mis au service de la révolution soviétique : structures géométriques industrielles, matériaux modernes (métal, verre), fusion voulue entre l'art, l'ingénierie et la propagande politique.",
    chrono:[["1915","Tatline conçoit ses premiers reliefs constructivistes"],["1919","Tour de la Troisième Internationale de Tatline, projet emblématique"],["1930","Répression stalinienne du mouvement au profit du réalisme socialiste"]] },
  "De Stijl": { parent:null, keyArtists:["Piet Mondrian", "Theo van Doesburg"], origin:"Pays-Bas", color:"#3D5AA3", period:"1917 – 1931",
    desc:"Néoplasticisme fondé par Mondrian et Van Doesburg : réduction radicale aux lignes horizontales et verticales, aux trois couleurs primaires et au noir/blanc, dans un idéal d'harmonie universelle.",
    chrono:[["1917","Fondation de la revue et du mouvement De Stijl"],["1920s","Mondrian systématise ses compositions à la grille"],["1931","Mort de Van Doesburg, dissolution du groupe"]] },
  "Bauhaus": { parent:null, keyArtists:["Walter Gropius"], origin:"Allemagne (école)", color:"#7A7A3D", period:"1919 – 1933",
    desc:"École allemande fusionnant art, artisanat et industrie : recherche d'un design fonctionnel et universel, enseignement transversal touchant peinture, textile, mobilier et architecture.",
    chrono:[["1919","Fondation à Weimar par Walter Gropius"],["1925","Déménagement à Dessau, bâtiment emblématique de Gropius"],["1933","Fermeture forcée par le régime nazi"]] },
  "École de Paris": { parent:null, keyArtists:["Amedeo Modigliani", "Marc Chagall", "Chaïm Soutine"], origin:"France (artistes étrangers)", color:"#8C5A3D", period:"1900 – 1940",
    desc:"Terme englobant les artistes étrangers venus s'installer à Paris, alors capitale mondiale de l'art moderne : Modigliani, Chagall, Soutine, Foujita, chacun gardant un style propre malgré ce point commun géographique.",
    chrono:[["1900s","Paris attire les avant-gardes du monde entier"],["1910-20s","Modigliani, Chagall, Soutine s'y installent"],["1940","La Seconde Guerre mondiale disperse la communauté"]] },
  "Art déco": { parent:null, keyArtists:[], origin:"France (transversal, arts décoratifs)", color:"#A3873D", period:"1910 – 1939",
    desc:"Esthétique du luxe géométrisé, héritière du cubisme et de l'Égypte antique redécouverte : lignes épurées, symétrie, matériaux précieux, touchant aussi bien la peinture que le mobilier et l'architecture.",
    chrono:[["1910s","Premières recherches géométriques dans les arts décoratifs"],["1925","Exposition internationale des Arts décoratifs à Paris, qui donne son nom au style"],["1939","Déclin avec la Seconde Guerre mondiale"]] },
  "Dadaïsme": { parent:null, keyArtists:["Marcel Duchamp", "Francis Picabia"], origin:"Suisse (Zurich), puis international", color:"#7A7A3D", period:"1916 – 1922",
    desc:"Révolte radicale contre les valeurs établies et l'absurdité de la guerre : recours au hasard, au collage de matériaux hétéroclites et au détournement d'objets ordinaires (ready-made).",
    chrono:[["1916","Fondation du Cabaret Voltaire à Zurich"],["1917","Duchamp présente Fontaine, un urinoir signé, comme œuvre d'art"],["1920","Le mouvement gagne Paris et Berlin"],["1922","Dissolution progressive, transition vers le surréalisme"]] },
  "Nouvelle Objectivité": { parent:null, keyArtists:["Otto Dix", "George Grosz"], origin:"Allemagne", color:"#6B3D3D", period:"1919 – 1933",
    desc:"Réaction désabusée à l'expressionnisme dans l'Allemagne de Weimar : réalisme froid et satirique, portraits sans complaisance de la société, dénonciation des séquelles morales et physiques de la guerre.",
    chrono:[["1919","Contexte de la République de Weimar naissante"],["1925","Exposition qui donne son nom au mouvement, à Mannheim"],["1933","Mouvement réprimé par le nazisme comme « art dégénéré »"]] },
  "Retour à l'ordre": { parent:null, keyArtists:["Pablo Picasso"], origin:"France, Europe", color:"#7A6B5A", period:"1918 – 1939",
    desc:"Après les ruptures radicales des avant-gardes d'avant-guerre, de nombreux artistes (dont Picasso) reviennent temporairement à des formes classiques et figuratives, dans un climat de reconstruction nationale.",
    chrono:[["1918","Fin de la Première Guerre mondiale, aspiration à la stabilité"],["1920s","Picasso peint sa « période classique », figures monumentales"],["1930s","Le mouvement s'estompe avec la montée des tensions des années 1930"]] },
  "Art abstrait": { parent:null, keyArtists:["Vassily Kandinsky", "Piet Mondrian"], origin:"International (Russie, Pays-Bas...)", color:"#3D6B9E", period:"1910 – aujourd'hui",
    desc:"Suppression totale ou partielle de la référence au monde visible, au profit d'un langage plastique autonome fondé sur la forme, la couleur et la composition pour elles-mêmes.",
    chrono:[["1910","Première aquarelle abstraite de Kandinsky"],["1915","Malevitch peint le Carré noir, jalon de l'abstraction radicale"],["1917","Mondrian fonde le mouvement De Stijl aux Pays-Bas"],["Après 1945","L'abstraction domine une grande partie de l'art occidental d'après-guerre"]] },
  "Surréalisme": { parent:null, keyArtists:["Salvador Dalí", "René Magritte", "Kay Sage"], origin:"France", color:"#5D3F87", period:"1924 – 1966",

/* ================= STORAGE WRAPPER (hard timeout so a hanging call can never freeze the app) ================= */
const ST_TIMEOUT_MS = 5000;
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('Délai dépassé (le stockage ne répond pas)')), ms || ST_TIMEOUT_MS))
  ]);
}
function makeLocalStorageBackend(){
  const NS = 'carnetart:';
  return {
    get: async (key) => {
      const v = localStorage.getItem(NS+key);
      return v === null ? null : { key, value: v };
    },
    set: async (key, value) => {
      localStorage.setItem(NS+key, value);
      return { key, value };
    },
    delete: async (key) => {
      localStorage.removeItem(NS+key);
      return { key, deleted: true };
    },
    list: async (prefix) => {
      const keys = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf(NS) === 0 && k.slice(NS.length).indexOf(prefix) === 0) keys.push(k.slice(NS.length));
      }
      return { keys };
    }
  };
}
function makeIndexedDBBackend(){
  let dbPromise = null;
  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open('carnetart-db', 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }
  return {
    get: async (key) => {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('kv','readonly');
        const req = tx.objectStore('kv').get(key);
        req.onsuccess = () => resolve(req.result !== undefined ? { key, value: req.result } : null);
        req.onerror = () => reject(req.error);
      });
    },
    set: async (key, value) => {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('kv','readwrite');
        tx.objectStore('kv').put(value, key);
        tx.oncomplete = () => resolve({ key, value });
        tx.onerror = () => reject(tx.error);
      });
    },
    delete: async (key) => {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('kv','readwrite');
        tx.objectStore('kv').delete(key);
        tx.oncomplete = () => resolve({ key, deleted: true });
        tx.onerror = () => reject(tx.error);
      });
    },
    list: async (prefix) => {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('kv','readonly');
        const req = tx.objectStore('kv').getAllKeys();
        req.onsuccess = () => resolve({ keys: req.result.filter(k => typeof k === 'string' && k.indexOf(prefix) === 0) });
        req.onerror = () => reject(req.error);
      });
    }
  };
}

  list: (prefix, shared) => withTimeout(storageBackend.list(prefix, shared)),
};
async function mapLimit(items, limit, fn){
  const results = new Array(items.length);
  let i = 0;
  async function worker(){
    while(i < items.length){
      const idx = i++;
      results[idx] = await fn(items[idx], idx);
    }
  }
  await Promise.all(new Array(Math.min(limit, items.length)).fill(0).map(worker));
  return results;
}

async function migrateArtistsFromArtworks(){
  const attempted = new Set();
  for(const a of artworks){
    if(a.artist && !getArtist(a.artist) && !attempted.has(a.artist) && (a.artistBio||a.artistBirth||a.artistNationality||a.artistPhoto||a.artistMajorWorks||a.artistAlert)){
      attempted.add(a.artist);
      const ok = await saveArtistRecord({ name:a.artist, birth:a.artistBirth||'', death:a.artistDeath||'', nationality:a.artistNationality||'', bio:a.artistBio||'', photo:a.artistPhoto||'', instagram:a.artistInstagram||'', majorWorks:a.artistMajorWorks||'', alert:a.artistAlert||'' });
      if(!ok) return; // stop the whole pass on first failure — don't hammer a struggling/rate-limited storage on every reload
      await new Promise(r=>setTimeout(r,150));
    }
  }
}

function normalizeArtwork(a){
  if(!Array.isArray(a.movements)){
    a.movements = a.movement ? [a.movement] : [];
  }
  return a;
}

async function loadArtworks(){
  let keys = [];
  let listSucceeded = false;
  try{
    const res = await st.list('artwork:', false);
    keys = res && res.keys ? res.keys : [];
    listSucceeded = true;
  }catch(e){
    listSucceeded = false;
  }

  if(!listSucceeded){
    // Could not verify what's actually stored — do NOT reseed (that's what caused duplicates
    // in the past when a transient failure was wrongly treated as "empty account").
    artworks = [];
    showLoadFailureWarning();
    return;
  }

  if(keys.length === 0){
    // Genuinely confirmed empty account — no pre-loaded content, a plain shared database for everything you add.
    artworks = [];
    return;
  }

  const results = await mapLimit(keys, 5, async key => {
    try{ const r = await st.get(key, false); return r && r.value ? JSON.parse(r.value) : null; }
    catch(e){ return null; }
  });
  artworks = results.filter(Boolean).map(normalizeArtwork);
}

let storageFailCount = 0;
async function saveArtwork(a){
  const payload = JSON.stringify(a);
  const attempt = async () => {
    const res = await st.set('artwork:'+a.id, payload, false);
    if(!res) throw new Error('no response');
    // verify: read back what was just written, since the platform's storage
    // has been observed to report success without the write actually persisting
    const check = await st.get('artwork:'+a.id, false);
    if(!check || check.value !== payload) throw new Error('write not confirmed on read-back');
  };
  try{
    await attempt();
  }catch(e){
    try{
      await new Promise(r=>setTimeout(r,300));
      await attempt();
    }catch(e2){
      storageFailCount++;
      if(storageFailCount === 1) console.error('Sauvegarde impossible sur cet appareil (stockage indisponible ou non confirmé).', e2);
      showStorageWarning();
    }
  }
}

async function verifyDeleted(id){
  try{
    const check = await st.get('artwork:'+id, false);
    return !check || !check.value; // resolved with nothing = confirmed gone
  }catch(e){
    return true; // throwing on a missing key is the normal convention for a gone item
  }
}
async function deleteArtworkStorage(id){
  const attempt = async () => {
    const res = await st.delete('artwork:'+id, false);
    if(!res) throw new Error('no response');
    const gone = await verifyDeleted(id);
    if(!gone) throw new Error('toujours présent après suppression');
  };
  try{
    await attempt();
    return true;
  }catch(e){
    try{
      await new Promise(r=>setTimeout(r,300));
      await attempt();
      return true;
    }catch(e2){
      console.error('Suppression impossible sur cet appareil (stockage indisponible).', e2);
      showStorageWarning();
      return false;
    }
  }
}
function findDuplicate(title, artist, excludeId){
  const t = title.trim().toLowerCase(), ar = artist.trim().toLowerCase();
  return artworks.find(a => a.id !== excludeId && a.title.trim().toLowerCase()===t && a.artist.trim().toLowerCase()===ar);
}

function nextId(){ return artworks.reduce((m,a)=>Math.max(m,a.id),0)+1; }

function shade(hex, percent) {
  const num = parseInt(hex.replace("#",""), 16);
  let r=(num>>16)+percent, g=(num>>8 & 0x00FF)+percent, b=(num & 0x0000FF)+percent;
  r=Math.min(255,Math.max(0,r)); g=Math.min(255,Math.max(0,g)); b=Math.min(255,Math.max(0,b));
  return "#" + (0x1000000 + r*0x10000 + g*0x100 + b).toString(16).slice(1);
}
function shuffled(arr){ return [...arr].sort(()=>Math.random()-0.5); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function paragraphs(text){ return (text||'').split(/\n+/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('') || '—'; }
function firstSentences(text, n){
  if(!text) return '';
  const matches = text.match(/[^.!?]+[.!?]+(\s|$)/g);
  if(!matches) return text;
  return matches.slice(0, n).join('').trim();
}
function placeholderImg(a){
  const primaryMovement = (a.movements && a.movements[0]) || a.movement;
  const c = movementInfo(primaryMovement).color;
  const initials = a.title.split(" ").slice(0,2).map(w=>w[0]).join("").toUpperCase();
  return `data:image/svg+xml;utf8,` + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='${c}'/><stop offset='100%' stop-color='${shade(c,-25)}'/></linearGradient></defs><rect width='400' height='400' fill='url(#g)'/><text x='200' y='215' font-family='Georgia,serif' font-size='90' fill='white' fill-opacity='0.85' text-anchor='middle'>${initials}</text></svg>`);
}
function imgSrc(a){ return a.imageUrl && a.imageUrl.trim() ? a.imageUrl : placeholderImg(a); }
function artistHasWorks(name){
  const n = name.trim().toLowerCase();
  return artworks.some(a => a.artist.trim().toLowerCase()===n);
}

/* Compress an uploaded/pasted image file into a small JPEG data URL */
function fileToDataURL(file, maxDim=1100, quality=0.78){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) { const scale = maxDim / Math.max(w,h); w = Math.round(w*scale); h = Math.round(h*scale); }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function deleteDuplicateEntry(id){
  const success = await deleteArtworkStorage(id);
  if(success){
    artworks = artworks.filter(x=>x.id!==id);
    if(findDuplicateGroups().length === 0){ closeForm(); goHome(); } else { openDuplicateManager(); }
  } else {
    showAlert("Suppression impossible pour l'instant (stockage indisponible) — réessayez.");
  }
}

function sanitizeFilename(s){
  return (s||'sans-titre').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60) || 'sans-titre';
}
function dataURLToBlob(dataURL){
  const parts = dataURLParts(dataURL);
  if(!parts) return null;
  const byteChars = atob(parts.base64);
  const bytes = new Uint8Array(byteChars.length);
  for(let i=0;i<byteChars.length;i++) bytes[i] = byteChars.charCodeAt(i);
  const ext = parts.mediaType.includes('png') ? 'png' : (parts.mediaType.includes('webp') ? 'webp' : 'jpg');
  return { blob: new Blob([bytes], {type: parts.mediaType}), ext };
}
async function downloadAllImages(){
  if(typeof JSZip === 'undefined'){ showAlert("Le module de compression n'a pas pu se charger — vérifiez votre connexion et réessayez."); return; }
  const zip = new JSZip();
  let included = 0, skippedExternal = 0;
  for(const a of artworks){
    const base = String(a.id).padStart(3,'0') + '-' + sanitizeFilename(a.title);
    if(a.imageUrl && a.imageUrl.startsWith('data:')){
      const r = dataURLToBlob(a.imageUrl);
      if(r){ zip.file(base + '-principale.' + r.ext, r.blob); included++; }
    } else if(a.imageUrl){ skippedExternal++; }
    (a.additionalImages||[]).forEach((img, i) => {
      if(img && img.startsWith('data:')){
        const r = dataURLToBlob(img);
        if(r){ zip.file(base + '-photo' + (i+1) + '.' + r.ext, r.blob); included++; }
      } else if(img){ skippedExternal++; }
    });
  }
  if(included === 0){ showAlert("Aucune image téléchargée/collée trouvée à exporter (seuls les liens externes sont utilisés pour l'instant)."); return; }
  const content = await zip.generateAsync({type:'blob'});
  const url = URL.createObjectURL(content);
  const link = document.createElement('a');
  link.href = url; link.download = 'images-carnet-art-'+new Date().toISOString().slice(0,10)+'.zip';
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  URL.revokeObjectURL(url);
  showAlert(included + ' image(s) téléchargée(s) dans le .zip' + (skippedExternal ? `, ${skippedExternal} image(s) en lien externe non incluse(s) (ce sont déjà des URLs, pas des fichiers).` : '.'));
}

function exportData(){
  const blob = new Blob([JSON.stringify(artworks, null, 2)], {type:'application/json'});

}
document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    try{
      const imported = JSON.parse(ev.target.result);
      if(!Array.isArray(imported)) throw new Error('format invalide');
      const existingTitles = new Set(artworks.map(a=>a.title.trim().toLowerCase()));
      const newOnes = imported.filter(a => a && a.title && !existingTitles.has(a.title.trim().toLowerCase())).map(normalizeArtwork);
      let id = nextId();
      for(const a of newOnes){ a.id = id++; }
      artworks = artworks.concat(newOnes);
      for(const a of newOnes){ await saveArtwork(a); }
      resetHomeScroll();
      goHome();
      showAlert(newOnes.length + ' œuvre(s) importée(s).');
    }catch(err){
      console.error('Erreur import', err);
      showAlert("Le fichier n'a pas pu être importé : " + esc((err && err.message) || String(err)));
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

async function fetchLocationOnly(title, artist){
  const prompt = `Pour l'œuvre "${title}" de ${artist}, réponds UNIQUEMENT avec un objet JSON valide, sans backticks ni texte autour :
{
  "museum": "nom du musée, de la galerie, du lieu ou de la collection où l'œuvre se trouve ou est exposée ; utilise \"Collection privée\" si non localisable publiquement",
  "museumCity": "ville, chaîne vide si vraiment inconnue",
  "museumCountry": "pays, chaîne vide si vraiment inconnue",
  "museumLink": "URL du site officiel si connue, chaîne vide sinon"
}
Sois factuel, n'invente rien que tu ne sois pas raisonnablement sûr.`;
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 300, messages: [{ role: "user", content: prompt }] })
  });
  if(!response.ok) throw new Error('Erreur API ' + response.status);
  const data = await response.json();
  const textResp = (data.content || []).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  const clean = textResp.replace(/```json|```/g,'').trim().replace(/[\r\n]+/g,' ');
  return JSON.parse(clean);
}

async function fillMissingLocations(){
  const missing = artworks.filter(a => !a.museum || !a.museum.trim());
  if(missing.length === 0){ showAlert("Toutes vos œuvres ont déjà un lieu renseigné."); return; }
  document.getElementById('overlayContent').innerHTML = `
    <div class="modal-form" style="max-width:400px;">
      <h2>Complétion des lieux</h2>
      <div class="sub">${missing.length} œuvre(s) sans lieu renseigné.</div>
      <div id="fillLocStatus" style="font-size:13px;color:var(--ink-soft);"></div>
      <div class="form-actions"><button class="small-btn ghost" onclick="closeForm()">Fermer</button></div>
    </div>`;
  document.getElementById('overlay').classList.add('open');
  const statusEl = document.getElementById('fillLocStatus');
  let done = 0, failed = 0;
  for(const a of missing){
    statusEl.textContent = `Traitement ${done+1}/${missing.length} : ${a.title}…`;
    try{
      const loc = await fetchLocationOnly(a.title, a.artist);
      a.museum = loc.museum || a.museum;
      a.museumCity = loc.museumCity || a.museumCity;
      a.museumCountry = loc.museumCountry || a.museumCountry;
      a.museumLink = loc.museumLink || a.museumLink;
      await saveArtwork(a);
      done++;
    }catch(e){
      console.error('Erreur lieu pour', a.title, e);
      failed++;
    }
  }
  statusEl.innerHTML = `Terminé — ${done} complétée(s)${failed?`, ${failed} échec(s)`:''}.`;
  render();
}

/* ================= ROUTER ================= */
function goToNextArtwork(currentId){
  let pool;
  if(detailContext.type === 'movement') pool = artworks.filter(a => (a.movements||[]).includes(detailContext.value));
  else if(detailContext.type === 'artist') pool = artworks.filter(a => a.artist.trim().toLowerCase() === detailContext.value.trim().toLowerCase());
  else if(detailContext.type === 'tag') pool = artworks.filter(a => (a.tags||[]).includes(detailContext.value));
  else if(detailContext.type === 'location') pool = artworks.filter(a => a.museum && a.museum.trim().toLowerCase() === detailContext.value.trim().toLowerCase());
  else pool = artworks;
  const others = pool.filter(a => a.id !== currentId);
  if(others.length === 0){ showAlert("Plus aucune autre œuvre dans cette sélection."); return; }
  const next = others[Math.floor(Math.random() * others.length)];
  browseHistory.push(currentId);
  showArtwork(next.id);
}
function goToPreviousArtwork(currentId){
  if(browseHistory.length === 0){ showAlert("Pas d'œuvre précédente dans ce parcours."); return; }
  const prevId = browseHistory.pop();
  showArtwork(prevId);
}

let detailObserver = null;
function setupDetailStickyHeader(a){
  const mainImg = document.querySelector('.main-image');
  const mini = document.getElementById('navMiniArtwork');
  const logo = document.querySelector('nav.top .logo');
  if(!mainImg || !mini) return;
  if(typeof IntersectionObserver === 'undefined') return;
  document.getElementById('navMiniImg').src = imgSrc(a);
  document.getElementById('navMiniTitle').textContent = a.title;
  if(detailObserver) detailObserver.disconnect();
  detailObserver = new IntersectionObserver((entries)=>{
    const visible = entries[0].isIntersecting;
    mini.style.display = visible ? 'none' : 'flex';
    if(logo) logo.style.display = visible ? 'block' : 'none';
  }, { threshold: 0, rootMargin: '-70px 0px 0px 0px' });
  detailObserver.observe(mainImg);
}
function teardownDetailStickyHeader(){
  if(detailObserver){ detailObserver.disconnect(); detailObserver = null; }
  const mini = document.getElementById('navMiniArtwork');
  const logo = document.querySelector('nav.top .logo');
  if(mini) mini.style.display = 'none';
  if(logo) logo.style.display = 'block';
}

function render(){
  const view = document.getElementById('view');
  if(currentView==='home') view.innerHTML = renderHome();
  else if(currentView==='detail') view.innerHTML = renderDetail(currentArtworkId);
  else if(currentView==='movement') view.innerHTML = renderMovementPage(currentMovement);
  else if(currentView==='artist') view.innerHTML = renderArtistPage(currentArtistName);
  else if(currentView==='location') view.innerHTML = renderLocationPage(currentLocationName);
  else if(currentView==='artistsByMovement') view.innerHTML = renderArtistsByMovementPage();
  else if(currentView==='allMovements') view.innerHTML = renderAllMovementsPage();
  else if(currentView==='creations') view.innerHTML = renderCreationsPage();
  else if(currentView==='creationDetail') view.innerHTML = renderCreationDetail(currentCreationId);
  attachDelegatedHandlers();
  if(currentView==='home') setupInfiniteScroll();
  if(currentView==='detail'){
    const a = artworks.find(x=>x.id===currentArtworkId);
    if(a) setupDetailStickyHeader(a); else teardownDetailStickyHeader();
  } else {
    teardownDetailStickyHeader();
  }
}
function setupInfiniteScroll(){
  const sentinel = document.getElementById('scrollSentinel');
  if(!sentinel) return;
  if(typeof IntersectionObserver === 'undefined'){
    sentinel.innerHTML = '<button class="navbtn" onclick="homeRenderCount+=HOME_BATCH;render();" style="display:block;margin:10px auto;">Charger plus</button>';
    return;
  }
  const obs = new IntersectionObserver((entries)=>{
    if(entries[0].isIntersecting){
      obs.disconnect();
      homeRenderCount += HOME_BATCH;
      render();
    }
  }, { rootMargin: '600px' });
  obs.observe(sentinel);
}
function attachDelegatedHandlers(){
  const view = document.getElementById('view');
  view.onclick = (e) => {
    const artworkEl = e.target.closest('[data-artwork]');
    if(artworkEl){
      if(currentView==='movement') detailContext = { type:'movement', value: currentMovement };
      else if(currentView==='artist') detailContext = { type:'artist', value: currentArtistName };
      else if(currentView==='location') detailContext = { type:'location', value: currentLocationName };
      else if(currentView==='home' && homeFilter.type) detailContext = { type: homeFilter.type, value: homeFilter.value };
      else detailContext = { type:null, value:null };
      browseHistory = [];
      showArtwork(parseInt(artworkEl.dataset.artwork));
      return;
    }
    const tagEl = e.target.closest('[data-tag]'); if(tagEl){ filterByTag(tagEl.dataset.tag); return; }
    const artistEl = e.target.closest('[data-artist]'); if(artistEl){ showArtist(artistEl.dataset.artist); return; }
    const locationEl = e.target.closest('[data-location]'); if(locationEl){ showLocation(locationEl.dataset.location); return; }
    const chipEl = e.target.closest('[data-filterchip]'); if(chipEl){ filterByMovement(chipEl.dataset.filterchip); return; }
    const mvLinkEl = e.target.closest('[data-movement-link]'); if(mvLinkEl){ showMovement(mvLinkEl.dataset.movementLink); return; }
    const creationEl = e.target.closest('[data-creation]'); if(creationEl){ showCreationDetail(parseInt(creationEl.dataset.creation)); return; }
    const zoomEl = e.target.closest('[data-zoomable]'); if(zoomEl){ openImageZoom(zoomEl.src); return; }
  };
}

/* ================= HOME ================= */
function renderHome(){
  if(artworks.length===0) return `<div class="empty-state"><h2>Votre carnet est vide</h2><p>Ajoutez votre première œuvre pour commencer la galerie.</p></div>`;
  let filtered = artworks;
  if(homeFilter.type==='movement') filtered = artworks.filter(a=>(a.movements||[]).includes(homeFilter.value));
  if(homeFilter.type==='tag') filtered = artworks.filter(a=>(a.tags||[]).includes(homeFilter.value));

  if(!homeShuffleIds){ homeShuffleIds = shuffled(filtered).map(a=>a.id); }
  const byId = Object.fromEntries(artworks.map(a=>[a.id,a]));
  const visibleIds = homeShuffleIds.slice(0, homeRenderCount);
  const items = visibleIds.map(id=>byId[id]).filter(Boolean);
  const hasMore = homeRenderCount < homeShuffleIds.length;

  return `
    <div class="home-toolbar"><h1>Galerie</h1><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft)">${filtered.length} œuvre${filtered.length>1?'s':''}</span></div>
    ${homeFilter.type==='tag' ? `<div class="active-filter-note">Filtré par mot-clé « ${esc(homeFilter.value)} » <button onclick="clearFilter()">effacer</button></div>` : ''}
    ${homeFilter.type==='movement' ? `<div class="active-filter-note">Filtré par courant « ${esc(homeFilter.value)} » <button onclick="clearFilter()">effacer</button></div>` : ''}
    ${items.length ? `<div class="home-grid">${items.map(a=>`<img src="${imgSrc(a)}" alt="${esc(a.title)}" title="${esc(a.title)}${a.period?` (${esc(a.period)})`:''} — ${esc(a.artist)}" data-artwork="${a.id}">`).join('')}</div>` : `<p style="color:var(--ink-soft);font-size:13px;">Aucune œuvre pour ce filtre.</p>`}
    ${hasMore ? `<div id="scrollSentinel" style="height:1px;"></div><div class="loading">Chargement…</div>` : ''}
  `;
}

/* ================= DETAIL ================= */
function renderDetail(id){
  const a = artworks.find(x=>x.id===id);
  if(!a) return `<p>Œuvre introuvable.</p>`;
  const artMovements = a.movements && a.movements.length ? a.movements : (a.movement ? [a.movement] : []);
  const artistRecForChips = getArtist(a.artist) || {};
  const similarChips = (artistRecForChips.similarArtists||'').split(',').map(s=>s.trim()).filter(Boolean).map(name=>{
    return artistHasWorks(name) ? `<span class="artist-chip" data-artist="${esc(name)}">${esc(name)}</span>` : `<span class="plain">${esc(name)}</span>`;
  }).join(', ');
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;">

/* ---- Extra photo dialog (upload / paste / URL) ---- */
function openPhotoDialog(artworkId){
  document.getElementById('overlayContent').innerHTML = `
    <div class="modal-form" style="max-width:440px;">
      <button class="close-x" onclick="closeForm()">✕</button>
      <h2>Ajouter une photo</h2>
      <div class="sub">Un croquis, une photo prise en expo, une capture d'écran...</div>
      <div class="image-zone" id="photoZone" tabindex="0">
        <div class="zone-text" id="photoZoneText">Cliquez pour choisir un fichier,<br>ou collez une image (Ctrl+V)</div>
        <input type="file" id="photoFile" accept="image/*" style="display:none">
      </div>
      <div class="or-sep">— ou collez un lien —</div>
      <input type="url" id="photoUrl" placeholder="https://...">
      <div class="form-actions">
        <button class="small-btn ghost" onclick="closeForm()">Annuler</button>
        <button class="small-btn" onclick="submitPhoto(${artworkId})">Ajouter</button>
      </div>
    </div>
  `;
  document.getElementById('overlay').classList.add('open');
  const zone = document.getElementById('photoZone');
  zone.addEventListener('click', ()=> document.getElementById('photoFile').click());
  document.getElementById('photoFile').addEventListener('change', async (e)=>{
    if(e.target.files[0]){ formMainImageData = await fileToDataURL(e.target.files[0]); document.getElementById('photoZoneText').innerHTML = '<img class="zone-preview" src="'+formMainImageData+'"><div>Image prête — cliquez « Ajouter »</div>'; }
  });
  zone.addEventListener('paste', async (e)=>{
    const items = (e.clipboardData || window.clipboardData).items;
    for(const item of items){
      if(item.type.indexOf('image')===0){
        const file = item.getAsFile();
        formMainImageData = await fileToDataURL(file);
        document.getElementById('photoZoneText').innerHTML = '<img class="zone-preview" src="'+formMainImageData+'"><div>Image collée — cliquez « Ajouter »</div>';
      }
    }
  });
  formMainImageData = null;
}
async function submitPhoto(artworkId){
  const url = document.getElementById('photoUrl').value.trim();
  const value = formMainImageData || url;
  if(!value){ document.getElementById('photoZoneText').innerHTML = '<span style="color:var(--accent);">Ajoutez un fichier, collez une image, ou renseignez un lien ci-dessous.</span>'; return; }
  const a = artworks.find(x=>x.id===artworkId);
  a.additionalImages = a.additionalImages || [];
  a.additionalImages.push(value);
  await saveArtwork(a);
  closeForm();
  render();
}

function toggleEditNotes(id){
  const disp = document.getElementById('notesDisplay-'+id), edit = document.getElementById('notesEdit-'+id);
  const open = edit.style.display === 'block';
  edit.style.display = open ? 'none' : 'block'; disp.style.display = open ? 'block' : 'none';
}
async function saveNotes(id){
  const val = document.getElementById('notesInput-'+id).value;
  const a = artworks.find(x=>x.id===id); a.myNotes = val;
  await saveArtwork(a); render();
}
function toggleEditComposition(id){
  const disp = document.getElementById('compDisplay-'+id), edit = document.getElementById('compEdit-'+id);
  const open = edit.style.display === 'block';
  edit.style.display = open ? 'none' : 'block'; disp.style.display = open ? 'block' : 'none';

  const val = document.getElementById('compInput-'+id).value;
  const a = artworks.find(x=>x.id===id); a.composition = val;
  await saveArtwork(a); render();
}

function renderAllMovementsPage(){
  const keys = movementKeys(); // chronological insertion order, custom-added ones appended at the end
  const mains = keys.filter(m => !movementInfo(m).parent);
  const childrenOf = {};
  keys.forEach(m => {
    const p = movementInfo(m).parent;
    if(p){ childrenOf[p] = childrenOf[p] || []; childrenOf[p].push(m); }
  });

  function firstLine(text){
    if(!text) return '';
    const match = text.match(/^[^.!?]+[.!?]+/);
    return match ? match[0].trim() : text.slice(0, 140).trim() + (text.length>140?'…':'');
  }

  function renderCard(m, isChild){
    const info = movementInfo(m);
    const artistsHtml = (info.keyArtists||[]).map(name => {
      return artistHasWorks(name) ? `<span class="a-link" data-artist="${esc(name)}">${esc(name)}</span>` : `<span style="color:var(--ink-soft);">${esc(name)}</span>`;
    }).join(', ');
    const thumbs = artworks.filter(a => (a.movements||[]).includes(m)).slice(0, 6);
    return `
      <div class="section" style="padding:16px 0;${isChild?'margin-left:24px;border-left:2px solid var(--line);padding-left:16px;':''}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
          <span class="a-link" data-movement-link="${esc(m)}" style="font-family:'Fraunces',serif;font-weight:500;font-size:${isChild?'16px':'19px'};">${esc(m)}</span>
          <button class="edit-link" onclick="openMovementInfoEditForm('${esc(m)}')">✎ Éditer</button>
        </div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);margin:4px 0 8px;">${esc(info.period)} · ${esc(info.origin)}</div>
        <div style="font-size:13.5px;line-height:1.6;color:var(--ink-soft);max-width:680px;">${esc(firstLine(info.desc))}</div>
        ${artistsHtml ? `<div style="font-size:12.5px;margin-top:8px;"><span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);text-transform:uppercase;">Artistes clés : </span>${artistsHtml}</div>` : ''}
        ${thumbs.length ? `<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;">${thumbs.map(a=>`<img src="${imgSrc(a)}" data-artwork="${a.id}" title="${esc(a.title)}" style="width:52px;height:52px;object-fit:cover;border-radius:3px;cursor:pointer;">`).join('')}</div>` : ''}
      </div>`;

function renderArtistsByMovementPage(){

async function submitCreationForm(id){
  const titleDrafts = document.getElementById('c-titles').value.trim();
  if(!titleDrafts){
    document.getElementById('c-titles').insertAdjacentHTML('afterend','<div style="color:var(--accent);font-size:12px;margin:4px 0 8px;">Notez au moins une piste de titre.</div>');
    return;
  }
  const data = {
    titleDrafts,
    status: document.getElementById('c-status').value,
    technique: document.getElementById('c-technique').value.trim(),
    colors: document.getElementById('c-colors').value.trim(),
    mainElements: document.getElementById('c-elements').value.trim(),
    inspirationText: document.getElementById('c-inspiration').value.trim(),
    inspirationLinks: [...document.querySelectorAll('.c-inspiration-cb:checked')].map(cb=>cb.value).join(', '),
    movements: [...document.getElementById('c-movement-select').selectedOptions].map(o=>o.value),
    composition: document.getElementById('c-composition').value.trim(),
    feeling: document.getElementById('c-feeling').value.trim(),
  };
  let updated;
  if(id){
    const idx = creations.findIndex(x=>x.id===id);
    updated = creations[idx] = {...creations[idx], ...data};
  } else {
    updated = { id: nextCreationId(), imageUrl:'', additionalImages:[], notes:'', dateAdded:new Date().toISOString().slice(0,10), ...data };
    creations.push(updated);
  }
  await saveCreation(updated);
  closeForm();
  showCreationDetail(updated.id);
}
async function deleteCreation(id){
  showConfirm("Supprimer définitivement cette création ?", async ()=>{
    const success = await deleteCreationStorage(id);
    if(success){ creations = creations.filter(x=>x.id!==id); closeForm(); showCreations(); }
    else showAlert("Suppression impossible pour l'instant (stockage indisponible).");
  });
}

  const disp = document.getElementById('cNotesDisplay-'+id), edit = document.getElementById('cNotesEdit-'+id);

  await saveCreation(c); render();
}
