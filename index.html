function openForm(id){
  editingId = id || null;
  const a = id ? artworks.find(x=>x.id===id) : {};
  formMainImageData = (a.imageUrl && a.imageUrl.startsWith('data:')) ? a.imageUrl : null;
  const currentMovements = a.movements && a.movements.length ? a.movements : (a.movement ? [a.movement] : []);
  const movementOptionsMulti = movementKeysAlpha().map(m=>`<option value="${esc(m)}" ${currentMovements.includes(m)?'selected':''}>${esc(m)}</option>`).join('');
  const artistList = allArtistNames();
  const isNewArtist = a.artist && !artistList.includes(a.artist);
  const artistOptions = artistList.map(n=>`<option value="${esc(n)}" ${a.artist===n?'selected':''}>${esc(n)}</option>`).join('');
  const existingUrl = (a.imageUrl && !a.imageUrl.startsWith('data:')) ? a.imageUrl : '';
  document.getElementById('overlayContent').innerHTML = `
    <div class="modal-form">
      <button class="close-x" onclick="closeForm()">✕</button>
      <h2>${id?'Modifier':'Ajouter'} une œuvre</h2>
      <div class="sub">${id?'Mettez à jour les informations de cette œuvre.':'Renseignez ce que vous savez — vous pourrez toujours compléter plus tard.'}</div>
      <fieldset>
        <legend>Œuvre</legend>
        <label>Titre (français) *</label><input type="text" id="f-title" value="${a.title||''}">
        <label>Titre en langue d'origine (si différent)</label><input type="text" id="f-originaltitle" value="${a.originalTitle||''}" placeholder="ex. Relativity">
        <label>Image principale</label>
        <div class="image-zone" id="mainImageZone" tabindex="0">
          ${formMainImageData ? `<img class="zone-preview" src="${formMainImageData}"><div class="zone-text">Cliquez pour remplacer, ou collez une nouvelle image (Ctrl+V)</div>` : `<div class="zone-text">Cliquez pour choisir un fichier,<br>ou collez une image (Ctrl+V)</div>`}
          <input type="file" id="mainImageFile" accept="image/*" style="display:none">
        </div>
        <div class="or-sep">— ou collez un lien —</div>
        <input type="url" id="f-image" value="${existingUrl}" placeholder="https://...">
        <label>Courant(s) — Ctrl/Cmd + clic pour sélection multiple</label>
        <select id="f-movement-select" multiple size="8">${movementOptionsMulti}</select>
        <label>Période / date</label><input type="text" id="f-period" value="${a.period||''}" placeholder="ex. 1818-1819">
        <label>Technique</label><input type="text" id="f-technique" value="${a.technique||''}" placeholder="ex. Huile sur toile">
        <label>À propos de l'œuvre</label><textarea id="f-description" style="min-height:90px;">${a.description||''}</textarea>
        <label>Composition, symbolique &amp; contexte historique</label><textarea id="f-composition" style="min-height:130px;" placeholder="Analyse détaillée...">${a.composition||''}</textarea>
        <label>Anecdote / Le saviez-vous ? (optionnel)</label><textarea id="f-anecdote" placeholder="Un détail insolite ou surprenant...">${a.anecdote||''}</textarea>
        <label>Mots-clés (séparés par des virgules)</label><input type="text" id="f-tags" value="${(a.tags||[]).join(', ')}">
      </fieldset>
      <fieldset>
        <legend>Artiste</legend>
        <label>Nom *</label>
        <select id="f-artist-select" onchange="document.getElementById('f-artist-new-wrap').style.display = this.value==='__new__' ? 'block' : 'none';">
          <option value="">— Choisir —</option>
          ${artistOptions}
          <option value="__new__" ${isNewArtist?'selected':''}>+ Nouvel artiste…</option>
        </select>
        <div id="f-artist-new-wrap" style="display:${isNewArtist?'block':'none'};margin-top:6px;">
          <input type="text" id="f-artist-new" value="${isNewArtist?esc(a.artist):''}" placeholder="Nom du nouvel artiste">
        </div>
        ${a.artist ? `<div style="margin-top:6px;"><button type="button" class="edit-link" onclick="openArtistEditForm('${esc(a.artist)}')">Modifier la fiche de ${esc(a.artist)} →</button></div>` : `<div style="font-size:11.5px;color:var(--ink-soft);margin-top:4px;">La biographie se modifie depuis la fiche artiste, une fois l'œuvre enregistrée.</div>`}
      </fieldset>
      <fieldset>
        <legend>Où voir l'œuvre</legend>
        <label>Musée / galerie</label><input type="text" id="f-museum" value="${a.museum||''}">
        <div class="row2"><div><label>Ville</label><input type="text" id="f-city" value="${a.museumCity||''}"></div><div><label>Pays</label><input type="text" id="f-country" value="${a.museumCountry||''}"></div></div>
      </fieldset>
      <div class="form-actions">
        ${id?`<button class="small-btn ghost" onclick="deleteArtwork(${id})" style="color:var(--accent);border-color:var(--accent);">Supprimer</button>`:''}
        <button class="small-btn ghost" onclick="closeForm()">Annuler</button>
        <button class="small-btn" onclick="submitForm()">Enregistrer</button>
      </div>
    </div>
  `;
  document.getElementById('overlay').classList.add('open');
  const zone = document.getElementById('mainImageZone');
  zone.addEventListener('click', ()=> document.getElementById('mainImageFile').click());
  document.getElementById('mainImageFile').addEventListener('change', async (e)=>{
    if(e.target.files[0]){
      formMainImageData = await fileToDataURL(e.target.files[0]);
      zone.innerHTML = `<img class="zone-preview" src="${formMainImageData}"><div class="zone-text">Cliquez pour remplacer, ou collez une nouvelle image (Ctrl+V)</div><input type="file" id="mainImageFile" accept="image/*" style="display:none">`;
      document.getElementById('f-image').value = '';
    }
  });
  zone.addEventListener('paste', async (e)=>{
    const items = (e.clipboardData || window.clipboardData).items;
    for(const item of items){
      if(item.type.indexOf('image')===0){
        formMainImageData = await fileToDataURL(item.getAsFile());
        zone.innerHTML = `<img class="zone-preview" src="${formMainImageData}"><div class="zone-text">Image collée — vous pouvez enregistrer</div>`;
        document.getElementById('f-image').value = '';
      }
    }
  });
}
function closeForm(){ document.getElementById('overlay').classList.remove('open'); editingId=null; formMainImageData=null; }

async function submitForm(){
  const title = document.getElementById('f-title').value.trim();
  const artistSelectVal = document.getElementById('f-artist-select').value;
  const artist = artistSelectVal === '__new__' ? document.getElementById('f-artist-new').value.trim() : artistSelectVal;
  if(!title || !artist){
    const el = document.getElementById('mainImageZone');
    if(el) el.insertAdjacentHTML('beforebegin', '<div style="color:var(--accent);font-size:12px;margin-bottom:8px;">Le titre et le nom de l\'artiste sont nécessaires.</div>');
    return;
  }
  const urlField = document.getElementById('f-image').value.trim();
  const data = {
    title, artist,
    originalTitle: document.getElementById('f-originaltitle').value.trim(),
    imageUrl: formMainImageData || urlField,
    movements: [...document.getElementById('f-movement-select').selectedOptions].map(o=>o.value),
    period: document.getElementById('f-period').value.trim(),
    technique: document.getElementById('f-technique').value.trim(),
    description: document.getElementById('f-description').value.trim(),
    composition: document.getElementById('f-composition').value.trim(),
    anecdote: document.getElementById('f-anecdote').value.trim(),
    tags: document.getElementById('f-tags').value.split(',').map(t=>t.trim()).filter(Boolean),
    museum: document.getElementById('f-museum').value.trim(),
    museumCity: document.getElementById('f-city').value.trim(),
    museumCountry: document.getElementById('f-country').value.trim(),
  };
  const currentEditingId = editingId;
  if(!currentEditingId){
    const dup = findDuplicate(title, artist);
    if(dup){
      showConfirm('« ' + title + ' » de ' + artist + ' est déjà dans votre carnet (N°' + String(dup.id).padStart(3,'0') + '). Créer quand même un doublon ?', async ()=>{
        await finishSubmitForm(data, currentEditingId);
      });
      return;
    }
  }
  await finishSubmitForm(data, currentEditingId);
}
async function finishSubmitForm(data, editingIdAtSubmit){
  let updated;
  if(editingIdAtSubmit){
    const idx = artworks.findIndex(x=>x.id===editingIdAtSubmit);
    updated = artworks[idx] = {...artworks[idx], ...data};
    await saveArtwork(updated);
  } else {
    updated = { id: nextId(), additionalImages:[], myNotes:"", dateAdded: new Date().toISOString().slice(0,10), ...data };
    artworks.push(updated);
    await saveArtwork(updated);
  }
  closeForm();
  showArtwork(updated.id);
}
async function deleteArtwork(id){
  showConfirm("Supprimer définitivement cette œuvre de votre carnet ?", async ()=>{
    const artwork = artworks.find(x=>x.id===id);
    const success = await deleteArtworkStorage(id);
    if(success){
      artworks = artworks.filter(x=>x.id!==id);
      goHome();
    } else {
      showAlert("La suppression a échoué (stockage indisponible sur cet appareil) — l'œuvre n'a pas été retirée. Réessayez, ou depuis un autre appareil.");
    }
  });
}
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeForm(); });

/* ================= INIT ================= */
(async function init(){
  document.getElementById('view').innerHTML = '<div class="loading">Chargement de votre carnet…</div>';
  await loadArtworks();
  await loadArtists();
  await loadCustomMovements();
  await loadCreations();
  await migrateArtistsFromArtworks();
  render();
})();
</script>
